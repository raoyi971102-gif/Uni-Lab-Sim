name: Modbus-Sim CI

on:
  push:
    branches: [main]
    paths:
      - 'Modbus-Sim/**'
      - '.github/workflows/modbus-sim.yml'
  pull_request:
    paths:
      - 'Modbus-Sim/**'
      - '.github/workflows/modbus-sim.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Modbus-Sim
            .github/workflows/modbus-sim.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装串口测试工具
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: 安装并测试
        working-directory: Modbus-Sim
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'
          python -m pytest
          python -m build
