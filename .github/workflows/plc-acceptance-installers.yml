name: SZLab PLC 自动验收 Windows 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - 'plc-acceptance-v*'
    paths:
      - 'plc-acceptance-kit/**'
      - 'PLC-Sim/**'
      - '.github/workflows/plc-acceptance-installers.yml'
  pull_request:
    paths:
      - 'plc-acceptance-kit/**'
      - 'PLC-Sim/**'
      - '.github/workflows/plc-acceptance-installers.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plc-acceptance-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: 安装 Windows 构建与测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c packaging/constraints.txt '../PLC-Sim[test]' '.[test]' pyinstaller build twine
      - name: 运行验收包与 PLC-Sim 回归
        run: |
          python -m pytest -q tests_py
          python -m pytest -q ../PLC-Sim/tests
      - name: 构建并检查验收 Python 包
        run: |
          python -m build --wheel --outdir artifacts
          python -m twine check artifacts/*.whl
      - name: 校验标签与验收包版本
        if: startsWith(github.ref, 'refs/tags/plc-acceptance-v')
        shell: pwsh
        run: |
          $version = python packaging/project_version.py pyproject.toml
          $tagVersion = $env:GITHUB_REF_NAME -replace '^plc-acceptance-v', ''
          if ($version -ne $tagVersion) {
            throw "标签版本 $tagVersion 与验收包版本 $version 不一致"
          }
      - name: 冻结 Windows x64 验收应用
        run: >-
          pyinstaller packaging/frozen_entry.py
          --name SZLab-PLC-Acceptance
          --onedir
          --windowed
          --clean
          --noconfirm
          --collect-all plc_acceptance
          --collect-all plc_sim
          --copy-metadata unilab-plc-acceptance
          --copy-metadata unilab-plc-sim
      - name: 验证冻结目录与完整 L1 验收
        run: python packaging/smoke_frozen.py dist/SZLab-PLC-Acceptance/SZLab-PLC-Acceptance.exe
      - name: 生成 Windows 安装程序
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python packaging/project_version.py pyproject.toml
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 构建失败，退出码 $LASTEXITCODE" }
      - name: 验证 Windows 安装程序结构
        shell: pwsh
        run: |
          $version = python packaging/project_version.py pyproject.toml
          python packaging/verify_artifact.py windows "artifacts/SZLab-PLC-Acceptance-Setup-Windows-x64-v$version.exe" --version $version
      - name: 验证真实安装目录并卸载
        shell: pwsh
        run: |
          $version = python packaging/project_version.py pyproject.toml
          $setup = (Resolve-Path "artifacts/SZLab-PLC-Acceptance-Setup-Windows-x64-v$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'SZLab-PLC-Acceptance-installed'
          $installer = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "安装程序退出码 $($installer.ExitCode)" }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          try {
            python packaging/smoke_frozen.py "$installDir/SZLab-PLC-Acceptance.exe"
            if ($LASTEXITCODE -ne 0) { throw "安装态完整 L1 验收失败" }
          }
          finally {
            if (Test-Path $uninstaller) {
              Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait
            }
          }
      - name: 生成 Windows 安装包校验和
        shell: pwsh
        run: |
          $version = python packaging/project_version.py pyproject.toml
          $setup = Get-Item "artifacts/SZLab-PLC-Acceptance-Setup-Windows-x64-v$version.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SZLab-PLC-Acceptance-Windows-x64
          path: |
            plc-acceptance-kit/artifacts/*.exe
            plc-acceptance-kit/artifacts/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/plc-acceptance-v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SZLab-PLC-Acceptance-Windows-x64
          path: release-assets
      - name: 发布 Windows x64 安装程序
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          @'
          SZLab PLC 自动验收 Windows x64 自包含安装包，无需预装 Python 或代码环境。

          下载 `SZLab-PLC-Acceptance-Setup-Windows-x64-*.exe`，双击安装后启动
          “SZLab PLC 自动验收”，即可一键运行内置 L1 仿真门禁。

          当前安装程序尚无商业代码签名，首次运行可能出现 Windows SmartScreen 提示。
          '@ | Set-Content -Encoding utf8 release-notes.md
          $assets = Get-ChildItem release-assets | ForEach-Object { $_.FullName }
          gh release create "$env:GITHUB_REF_NAME" $assets --verify-tag --title "SZLab PLC 自动验收 $($env:GITHUB_REF_NAME -replace '^plc-acceptance-v', '')" --notes-file release-notes.md
