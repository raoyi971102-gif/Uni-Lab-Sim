name: Modbus-Sim Windows 安装包

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'modbus-sim-v*'
    paths:
      - 'Modbus-Sim/**'
      - '.github/workflows/modbus-sim-installers.yml'
  pull_request:
    paths:
      - 'Modbus-Sim/**'
      - '.github/workflows/modbus-sim-installers.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Modbus-Sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: 安装并测试
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'
          python -m pytest -q
      - name: 校验发布标签与版本
        if: startsWith(github.ref, 'refs/tags/modbus-sim-v')
        shell: bash
        run: |
          package_version="$(python packaging/project_version.py pyproject.toml)"
          tag_version="${GITHUB_REF_NAME#modbus-sim-v}"
          test "$package_version" = "$tag_version"

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Modbus-Sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install . 'pyinstaller==6.16.0'
      - name: 获取并校验 com0com 再分发文件
        run: python packaging/prepare_com0com.py
      - name: 冻结 Windows 应用
        run: >-
          pyinstaller packaging/frozen_entry.py
          --name Modbus-Sim
          --onedir
          --windowed
          --clean
          --noconfirm
          --collect-all modbus_sim
          --copy-metadata unilab-modbus-sim
      - name: 冒烟测试冻结应用和真实 Modbus TCP 往返
        run: python packaging/smoke_frozen.py dist/Modbus-Sim/Modbus-Sim.exe
      - name: 生成 Windows 安装程序
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python packaging/project_version.py pyproject.toml
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows-installer.iss"
      - name: 校验 Windows 安装程序
        shell: pwsh
        run: |
          $version = python packaging/project_version.py pyproject.toml
          python packaging/verify_artifact.py "artifacts/Modbus-Sim-Setup-Windows-x64-v$version.exe" --version $version
      - uses: actions/upload-artifact@v4
        with:
          name: Modbus-Sim-Windows-x64
          path: Modbus-Sim/artifacts/*.exe
          if-no-files-found: error
