name: PLC-Sim CI / 手动部署

on:
  push:
    branches: [main]
    paths:
      - 'PLC-Sim/**'
      - '.github/workflows/deploy.yml'
      - '.cnb.yml'
  workflow_dispatch:

env:
  REMOTE_DIR: /www/wwwroot/PLC-Sim

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 仓库另外的大型资料部署用不到，只拉 PLC-Sim 和测试会校验的 workflow 配置
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            PLC-Sim
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        working-directory: PLC-Sim
        run: pip install -r requirements.txt pytest   # pytest 只在 CI 用，不进运行时依赖
      - name: 单元测试
        working-directory: PLC-Sim
        run: python -m pytest -q
      - name: 集成自检
        working-directory: PLC-Sim
        run: python tests/integration/remote_attach_check.py

  deploy:
    needs: test
    # 推代码只跑测试；上线要到 Actions 页面手动点 Run workflow。
    # 部署会重启 GUI 并杀掉 Server/Agent，不适合每次 push 都来一遍。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: PLC-Sim

      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # 页面右上角徽章读这个文件，用来确认线上跑的到底是哪次提交
      - name: 生成版本号
        run: |
          echo "${GITHUB_SHA:0:7} $(date -u '+%Y-%m-%d %H:%M UTC')" > PLC-Sim/VERSION
          cat PLC-Sim/VERSION

      - name: 同步代码
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='.DS_Store' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='data/uploads/' \
            --exclude='extracted/' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_deploy" \
            PLC-Sim/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"

      - name: 装依赖、重启 GUI、健康检查
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
              "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DIR"
          bash scripts/ensure_deploy_venv.sh "$REMOTE_DIR"
          chown -R www:www "$REMOTE_DIR"

          # GUI 托管模式下 Server/Agent 是 GUI 的子进程。GUI 被杀时它们会变成孤儿
          # 继续占着 4855，导致下次在网页上点启动必然失败，所以这里一并清掉。
          pkill -f "$REMOTE_DIR/server\.py" || true
          # 覆盖 SZLab 握手代理；历史命名 handshake_agent.py 一并匹配
          # 都会留下第二个代理去抢同一批握手标志位
          pkill -f "$REMOTE_DIR/[a-z_]*handshake_agent\.py" || true
          GUI_PATTERN="$REMOTE_DIR/.venv/bin/python -m gui.backend"
          OLD_PID="$(pgrep -f "$GUI_PATTERN" | head -1 || true)"
          pkill -f "$GUI_PATTERN" || true
          # uvicorn 收到 TERM 会先关监听端口，再等所有连接断开才退出，而日志用的是
          # SSE 长连接，永远不断。光发 TERM 会让它卡在"端口没了、进程还在"的中间
          # 态：supervisor 看不到退出就不会重拉，服务直接躺平。所以补一刀 KILL。
          for _ in $(seq 10); do
            pgrep -f "$GUI_PATTERN" >/dev/null || break
            sleep 1
          done
          pkill -9 -f "$GUI_PATTERN" || true
          # 不显式拉起 GUI —— Supervisor 的 autorestart 负责这件事

          # 必须等到 pid 变了才算数：老进程收到 TERM 后还能应答一会儿，直接 curl
          # 会打在将死的老 backend 上，新代码起不来也照样报绿。
          for _ in $(seq 30); do
            sleep 1
            NEW_PID="$(pgrep -f "$GUI_PATTERN" | head -1 || true)"
            [ -n "$NEW_PID" ] && [ "$NEW_PID" != "$OLD_PID" ] || continue
            if curl -fsS http://127.0.0.1:18765/api/health >/dev/null 2>&1; then
              echo "GUI 已恢复 (pid $OLD_PID -> $NEW_PID)"
              exit 0
            fi
          done
          echo "GUI 未在 30 秒内恢复，请查看 Supervisor 日志" >&2
          exit 1
          REMOTE

      - name: 提示
        run: echo "部署完成。GUI 托管模式下 Server 和 Agent 需要到网页上重新启动。"

  # 手动部署时把当前 main 同步到 cnb.cool；国内机由 CNB 的 .cnb.yml 接手部署。
  sync_cnb:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main to cnb.cool
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_USERNAME: ${{ secrets.CNB_USERNAME || 'cnb' }}
        run: |
          set -euo pipefail
          test -n "${CNB_TOKEN:-}" || { echo "Missing secret CNB_TOKEN" >&2; exit 1; }
          git remote remove cnb 2>/dev/null || true
          git remote add cnb "https://${CNB_USERNAME}:${CNB_TOKEN}@cnb.cool/emoera/PLC-Sim.git"
          git push cnb "HEAD:refs/heads/main" --force
