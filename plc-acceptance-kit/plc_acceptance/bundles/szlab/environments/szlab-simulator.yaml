schema: unilab.plc_acceptance.environment/v1
id: szlab-plc-sim-l1
kind: simulator
endpoint: opc.tcp://127.0.0.1:4855/xuse_sim/
connect_timeout_ms: 5000
poll_interval_ms: 20

# PLC-Sim Handshake Agent 通过同一 OPC UA 用户身份维护 PLC 输出，因此 L1 不校验
# PLC 输出不可写；真 PLC/软 PLC 环境必须设为 true。
enforce_access_level: false
allow_physical_actions: true
evidence_level: L1 协议仿真证据
scope_statement: 仅证明 PLC-Sim 正式双进程路径和当前 SZLab 握手契约，不代表软 PLC、真机机构或功能安全验收。
service_endpoints:
  s1: http://127.0.0.1:8055/api/v1
