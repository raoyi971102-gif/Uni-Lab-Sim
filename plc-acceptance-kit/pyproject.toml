[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilab-plc-acceptance"
version = "0.1.0"
description = "Configuration-driven OPC UA acceptance runner for UniLab PLC projects"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "opcua==0.98.13",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
plc-acceptance = "plc_acceptance.cli:main"

[tool.setuptools.packages.find]
include = ["plc_acceptance*"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
addopts = "-q"
