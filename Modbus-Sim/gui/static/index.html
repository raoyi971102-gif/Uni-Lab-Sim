<!doctype html>
<!--
THESIS: Modbus-Sim 是多窗口现场工程桌面；拒绝以欢迎页、指标卡或大块留白组织协议工具。
OWN-WORLD: 冷灰平面、工业蓝选择、语义状态色、紧凑系统字与等宽数据；边框承担层级，阴影只属于临时浮层。
STORY: 工程师选择传输链路和从站，在并排数据文档中定义或监视寄存器，再从常驻报文带确认真实交互。
FIRST VIEWPORT: 顶部状态与命令栏；左侧采用方案 C 的设备树；中央采用方案 B 的双文档桌面；右侧连接检查器；底部通信流量。
FORM: 用户选择的标准工业控制台；以方案 B 为主、融合方案 C 设备树；operate 模式，concept seed a3fe7104 后选择 category canon。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Modbus-Sim 工程工作台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="product-lockup">
      <span class="product-mark" aria-hidden="true">MB</span>
      <strong>Modbus-Sim</strong>
      <span class="version-label" id="versionLabel">v—</span>
    </div>
    <nav class="menu-bar" aria-label="应用菜单">
      <button type="button" data-menu-action="import">导入配置</button>
      <button type="button" data-menu-action="connection">连接设置</button>
      <button type="button" data-menu-action="device">添加从站</button>
      <button type="button" data-menu-action="traffic">查看报文</button>
      <a href="/api/config/yaml" download>导出配置</a>
    </nav>
    <div class="runtime-summary" aria-label="服务运行摘要">
      <span class="state-badge" id="stateBadge"><i></i><b>已停止</b></span>
      <span><small>Tx</small><b id="txCount">0</b></span>
      <span><small>Rx</small><b id="rxCount">0</b></span>
      <span><small>Error</small><b id="errorCount">0</b></span>
      <span class="uptime"><small>运行时间</small><b id="uptimeValue">00:00:00</b></span>
    </div>
  </header>

  <section class="command-bar" aria-label="常用命令">
    <div class="command-group">
      <button class="command" id="btnImport" type="button"><span aria-hidden="true">↥</span>导入 YAML</button>
      <a class="command" href="/api/config/yaml" download><span aria-hidden="true">↧</span>导出 YAML</a>
      <input id="yamlFile" type="file" accept=".yaml,.yml,application/yaml,text/yaml" hidden>
    </div>
    <span class="command-divider" aria-hidden="true"></span>
    <div class="command-group primary-commands">
      <button class="command primary" id="btnStart" type="button"><span aria-hidden="true">▶</span>启动服务</button>
      <button class="command danger" id="btnStop" type="button" disabled><span aria-hidden="true">■</span>停止</button>
    </div>
    <span class="command-divider" aria-hidden="true"></span>
    <div class="command-group">
      <button class="command" id="btnAddDevice" type="button">＋ 添加从站</button>
      <button class="command" id="btnClearTraffic" type="button">清空报文</button>
    </div>
    <div class="endpoint-line">
      <span>当前端点</span>
      <code id="endpointValue">尚未载入</code>
    </div>
    <button class="command inspector-toggle" id="btnToggleInspector" type="button" aria-expanded="false">连接设置</button>
  </section>

  <main class="workbench">
    <aside class="explorer" aria-label="传输、设备和数据区">
      <section class="explorer-section transport-section">
        <div class="section-heading">
          <h2>传输层</h2>
          <span id="transportStatus">未运行</span>
        </div>
        <div class="transport-list" id="transportList"></div>
      </section>
      <section class="explorer-section device-section">
        <div class="section-heading">
          <h2>设备与数据区</h2>
          <button id="btnTreeAdd" type="button" title="添加从站">＋</button>
        </div>
        <div class="device-tree" id="deviceTree"></div>
      </section>
      <div class="explorer-footer">
        <span>协议地址</span>
        <button id="addressBaseToggle" type="button" aria-pressed="false">显示 PLC 基址</button>
      </div>
    </aside>

    <section class="document-desk" aria-label="寄存器文档工作区">
      <div class="document-tabs" id="documentTabs" aria-label="已打开数据文档"></div>
      <div class="document-grid" id="documentGrid"></div>
    </section>

    <aside class="inspector" id="inspector" aria-label="连接设置和服务状态">
      <section class="inspector-section">
        <div class="section-heading">
          <h2>连接设置</h2>
          <span id="configLock">可编辑</span>
        </div>
        <form id="connectionForm" class="connection-form"></form>
        <button class="full-button" id="btnApplyConfig" type="button">应用连接设置</button>
      </section>
      <section class="inspector-section service-inspector">
        <div class="section-heading">
          <h2>服务管理</h2>
          <span class="inline-state" id="inlineState"><i></i>已停止</span>
        </div>
        <dl class="service-facts">
          <div><dt>传输方式</dt><dd id="factTransport">—</dd></div>
          <div><dt>活动连接</dt><dd id="factConnections">0</dd></div>
          <div><dt>从站数量</dt><dd id="factDevices">0</dd></div>
          <div><dt>通信错误</dt><dd id="factErrors">0</dd></div>
        </dl>
        <div class="error-box" id="lastError" hidden></div>
      </section>
      <section class="inspector-section selected-inspector">
        <div class="section-heading"><h2>当前文档</h2></div>
        <dl class="service-facts" id="selectedDocumentFacts"></dl>
      </section>
    </aside>
  </main>

  <section class="traffic-panel" id="trafficPanel" aria-label="通信流量">
    <header class="traffic-toolbar">
      <div>
        <h2>通信流量</h2>
        <span id="trafficLiveLabel">等待服务启动</span>
      </div>
      <div class="traffic-controls">
        <label><input id="showTx" type="checkbox" checked> Tx</label>
        <label><input id="showRx" type="checkbox" checked> Rx</label>
        <label><input id="showErrors" type="checkbox" checked> Error</label>
        <label><input id="trafficAutoScroll" type="checkbox" checked> 自动滚动</label>
        <input id="trafficSearch" type="search" placeholder="筛选功能码、地址或数据" aria-label="筛选通信流量">
      </div>
    </header>
    <div class="traffic-table-wrap" id="trafficTableWrap">
      <table class="traffic-table">
        <thead><tr><th>时间</th><th>方向</th><th>传输</th><th>从站</th><th>功能码</th><th>地址</th><th>数量</th><th>数据（Hex）</th></tr></thead>
        <tbody id="trafficRows"><tr class="empty-row"><td colspan="8">服务启动后显示真实 Modbus 收发报文</td></tr></tbody>
      </table>
    </div>
  </section>

  <footer class="status-bar">
    <span id="statusMessage">正在载入配置…</span>
    <span><i class="status-led"></i><b id="footerState">就绪</b></span>
  </footer>

  <dialog id="pointDialog" class="editor-dialog">
    <form method="dialog" id="pointForm">
      <header>
        <div><span>寄存器定义</span><h2 id="pointDialogTitle">编辑地址</h2></div>
        <button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button>
      </header>
      <div class="dialog-body">
        <div class="readonly-address"><span>地址</span><code id="pointAddress">—</code></div>
        <label><span>别名</span><input id="pointAlias" autocomplete="off"></label>
        <label><span id="pointValueLabel">初值</span><input id="pointValue" autocomplete="off" required></label>
        <label><span>显示格式</span><select id="pointFormat"></select></label>
        <label><span>说明</span><textarea id="pointDescription" rows="3"></textarea></label>
        <p class="dialog-note" id="pointDialogNote"></p>
      </div>
      <footer><button type="button" data-close-dialog>取消</button><button class="primary" id="btnSavePoint" type="submit">保存</button></footer>
    </form>
  </dialog>

  <dialog id="deviceDialog" class="editor-dialog compact-dialog">
    <form method="dialog" id="deviceForm">
      <header><div><span id="deviceDialogMode">设备模型</span><h2 id="deviceDialogTitle">添加 Modbus 从站</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></header>
      <div class="dialog-body">
        <label><span>从站地址（Unit ID）</span><input id="newUnitId" type="number" min="1" max="247" value="3" required></label>
        <label><span>设备名称</span><input id="newDeviceName" value="New Device" required></label>
        <fieldset class="area-size-grid">
          <legend>数据区大小</legend>
          <label><span>线圈</span><input id="sizeCoils" type="number" min="1" max="65536" value="16" required></label>
          <label><span>离散输入</span><input id="sizeDiscreteInputs" type="number" min="1" max="65536" value="16" required></label>
          <label><span>保持寄存器</span><input id="sizeHoldingRegisters" type="number" min="1" max="65536" value="16" required></label>
          <label><span>输入寄存器</span><input id="sizeInputRegisters" type="number" min="1" max="65536" value="16" required></label>
        </fieldset>
      </div>
      <footer><button type="button" data-close-dialog>取消</button><button class="primary" id="btnSaveDevice" type="submit">添加</button></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <datalist id="serialPortOptions"></datalist>
  <script src="/static/app.js" defer></script>
</body>
</html>
