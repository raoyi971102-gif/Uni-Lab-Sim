version: 1
active_transport: tcp

transports:
  tcp:
    host: 0.0.0.0
    port: 5020
  rtu-rs485:
    device: /dev/ttyUSB0
    baudrate: 9600
    bytesize: 8
    parity: N
    stopbits: 1
    timeout: 1.0
    handle_local_echo: false
    reconnect_delay: 0.5
  rtu-rs232:
    device: /dev/ttyS0
    baudrate: 9600
    bytesize: 8
    parity: N
    stopbits: 1
    timeout: 1.0
    handle_local_echo: false
    reconnect_delay: 0.5
  ascii:
    device: /dev/ttyUSB0
    baudrate: 9600
    bytesize: 7
    parity: E
    stopbits: 1
    timeout: 1.0
    handle_local_echo: false
    reconnect_delay: 0.5

devices:
  - unit_id: 1
    name: Demo PLC
    areas:
      coils:
        size: 16
        points:
          0: {alias: Run_Command, value: false, description: 运行命令}
          1: {alias: Alarm_Reset, value: false, description: 报警复位}
          2: {alias: Pump_Enable, value: true, description: 水泵使能}
      discrete_inputs:
        size: 16
        points:
          0: {alias: Ready, value: true, description: 设备就绪}
          1: {alias: Running, value: false, description: 运行反馈}
          2: {alias: Alarm, value: false, description: 报警状态}
      holding_registers:
        size: 32
        points:
          0: {alias: Speed_Setpoint, value: 1200, format: uint16, description: 转速设定}
          1: {alias: Temperature_Limit, value: 850, format: uint16, description: 温度上限 ×0.1°C}
          2: {alias: Batch_Count, value: 12, format: uint16, description: 批次计数}
          3: {alias: Command_Word, value: 0, format: hex, description: 控制字}
      input_registers:
        size: 32
        points:
          0: {alias: Actual_Speed, value: 1185, format: uint16, description: 实际转速}
          1: {alias: Temperature, value: 236, format: uint16, description: 温度 ×0.1°C}
          2: {alias: Status_Word, value: 5, format: hex, description: 状态字}
          3: {alias: Error_Code, value: 0, format: hex, description: 故障码}
  - unit_id: 2
    name: Auxiliary I/O
    areas:
      coils: {size: 16, points: {0: {alias: Beacon, value: false, description: 警示灯}}}
      discrete_inputs: {size: 16, points: {0: {alias: Door_Closed, value: true, description: 门已关闭}}}
      holding_registers: {size: 16, points: {0: {alias: Delay_ms, value: 500, format: uint16, description: 动作延时}}}
      input_registers: {size: 16, points: {0: {alias: Cycle_Count, value: 42, format: uint16, description: 循环次数}}}
