[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilab-modbus-sim"
version = "0.1.0"
description = "Modbus TCP, RTU RS-485/RS-232, and ASCII simulator with a Web GUI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pymodbus[serial]==3.15.0",
  "PyYAML==6.0.3",
  "fastapi==0.139.2",
  "uvicorn==0.51.0",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx2>=2,<3",
  "build>=1.2,<2",
  "setuptools>=68",
  "wheel>=0.42",
]

[project.scripts]
modbus-sim = "modbus_sim.cli:main"

[tool.setuptools]
packages = ["modbus_sim", "modbus_sim.gui"]
package-dir = {modbus_sim = ".", "modbus_sim.gui" = "gui"}
include-package-data = false

[tool.setuptools.package-data]
modbus_sim = ["config/*.yaml"]
"modbus_sim.gui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
