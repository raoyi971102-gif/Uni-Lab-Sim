apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plc-sim-data
  namespace: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plc-sim
  namespace: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plc-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plc-sim
        app.kubernetes.io/part-of: uni-lab-szlab
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: plc-sim
          image: localhost:5050/plc-sim:dual-task-attachment-v5
          imagePullPolicy: IfNotPresent
          args: [gui, --host, 0.0.0.0, --port, "18765", --no-open]
          env:
            - name: PLCSIM_DATA_DIR
              value: /var/lib/plc-sim
            - name: PLCSIM_CSV
              value: /opt/plc-sim/data/szlab_plc_0810.csv
          ports:
            - name: gui
              containerPort: 18765
            - name: opcua
              containerPort: 4855
          startupProbe:
            httpGet:
              path: /api/health
              port: gui
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: gui
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: gui
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/plc-sim
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: plc-sim-data
---
apiVersion: v1
kind: Service
metadata:
  name: plc-sim
  namespace: app
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: plc-sim
  ports:
    - name: gui
      port: 18765
      targetPort: gui
    - name: opcua
      port: 4855
      targetPort: opcua
