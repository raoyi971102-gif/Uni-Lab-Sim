apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plc-sim-data
  namespace: xiongyanfei
  labels:
    app.kubernetes.io/name: plc-sim
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plc-sim
  namespace: xiongyanfei
  labels:
    app.kubernetes.io/name: plc-sim
    app.kubernetes.io/part-of: uni-lab-szlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plc-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plc-sim
        app.kubernetes.io/part-of: uni-lab-szlab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plc-sim
          image: plc-sim:7c3c36e-gui-v1
          imagePullPolicy: Never
          args: [gui, --host, 0.0.0.0, --port, "18765", --no-open]
          env:
            - name: OPCUASIM_DATA_DIR
              value: /var/lib/opcua-sim
            - name: OPCUASIM_CSV
              value: /opt/opcua-sim/data/szlab_plc_0810.csv
          ports:
            - name: gui
              containerPort: 18765
            - name: opcua
              containerPort: 4855
          startupProbe:
            httpGet:
              path: /api/health
              port: gui
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: gui
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: gui
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/opcua-sim
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: plc-sim-data
---
apiVersion: v1
kind: Service
metadata:
  name: plc-sim
  namespace: xiongyanfei
  labels:
    app.kubernetes.io/name: plc-sim
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: plc-sim
  ports:
    - name: gui
      port: 18765
      targetPort: gui
      nodePort: 30160
    - name: opcua
      port: 4855
      targetPort: opcua
      nodePort: 30161
