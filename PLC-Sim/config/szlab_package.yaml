    S072:1: null
    S072:2: null
    S08:1: null
    S08:2: null
    S09:BEAKER: null
  quantities:
    reagent-1.ml: 100.0
    reagent-2.ml: 100.0
    reagent-3.ml: 100.0
    reagent-4.ml: 100.0
    reagent-5.ml: 100.0
    coarse-powder-1.g: 100.0
    fine-powder-1.g: 100.0
