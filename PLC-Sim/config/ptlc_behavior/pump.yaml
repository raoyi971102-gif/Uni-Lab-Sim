schema: ptlc.plc_choreography/v1
station: Pump
codesys_project: 20260702.project
extracted_at: "2026-08-10"

dispatcher:
  pou: Application/50_action/Pump_L2
  sha256: 8f4f51cce13b2d7e224c09821ac157c47e94f41c824bdd0abf281a8bea995e24
  accepts: [10, 20]
  unknown_code_error: 101
  gate_errors:
    190: 全局部署门 (NOT PLC_Ready 或 PLC_Deploy_State<>0), 在任何物理动作派发前拒绝
  notes: |
    标准 CASE State OF 派发器 (与 FeedLift/Develop 同构): IDLE 受理 -> RUNNING 每周期
    调原子 -> bActionDone/bActionError -> 终态等 Start 落沿或 Reset 回 IDLE。
    RUNNING 中 Reset 直接回 IDLE (不写 CompletedSeq, 不产 INTERRUPTED)。
    Pump_L2_Step 只在 IDLE 被写 0, 两个原子都不写它 —— 看门狗全程静默。

constants:
  vacuum_slot_index: 11        # 上位机专用泵槽下标; [0..8] 留给排液等 PLC 内部占用者
  slot_total: 12               # 大真空泵站位[0..11] 引用计数总线宽度

actions:
  "10":
    name: A10_vacuum_on
    pou: Application/50_action/Pump_L2/A10_vacuum_on
    sha256: 1e474b690ebb1fa656d13135a8b0a08f4d2d377f87430de3710459b8e3bfe466
    kind: instant
    summary: 置上位机泵槽 大真空泵站位[11] := TRUE, 同扫描 DONE
    steps: []
    errors: {}
    notes: |
      本体只有两行: `大真空泵站位[11] := TRUE; bActionDone := TRUE;`。
      **不直接驱动线圈** —— 实际 %QX2.4 由 PLC_Pump_泵管理 (每扫描运行) 聚合整条
      引用计数总线后驱动, 见下面"聚合器"一节。故本动作对沙盒而言就是写一个 BOOL 槽位。

  "20":
    name: A20_vacuum_off
    pou: Application/50_action/Pump_L2/A20_vacuum_off
    sha256: d7c4baf1dd7b027fd0d04782270b2da4588ab5df80f61e807d5e593b086a71c2
    kind: instant
    summary: 清上位机泵槽 大真空泵站位[11] := FALSE, 同扫描 DONE
    steps: []
    errors: {}
    notes: |
      本体两行同构。清的只是 [11] 这一槽 —— 排液 FSM 占的 [0..8] 仍可独立保持真空,
      所以"关泵"未必真停泵 (总线上还有别的占用者时 %QX2.4 保持)。

aggregator:
  pou: Application/50_action/PLC_Pump_泵管理
  sha256: 40cb5725b1c57e2073df82b8a3e49d480c3a7abb25dbd07a4f86d60be6781c8f
  summary: 每扫描把 大真空泵站位[0..11] 或起来, 过部署门后驱动 大真空泵自动 -> %QX2.4
  notes: |
    行为层若要仿真"泵到底转没转", 判据是这段而不是单个槽位:
      bAnyPumpCommandRequested = OR(大真空泵站位[0..11])
      装载闩 bPumpCommandsArmed: (NOT PLC_Ready) 或 (Deploy_State 非 0 且非 30) -> FALSE;
        全部槽位归 FALSE 后才重新 TRUE (**禁止解锁时补执行**: 维护期间写进来的站位
        必须先全清, 否则解锁瞬间不会补开泵)
      大真空泵自动 = PLC_Ready AND (Deploy_State ∈ {0,30}) AND bPumpCommandsArmed
                      AND bAnyPumpCommandRequested
    上位机可观测镜像 (本 POU 借道每扫描写):
      Pump_Vacuum_On := 大真空泵自动          # **是命令态, 不是接触器/真空度反馈**
      Expand_Waste_Empty_G1 := 展缸1溶剂废液检测传感器   # TRUE = 该组废液管已走空
      Expand_Waste_Empty_G2 := 展缸2溶剂废液检测传感器   # A26/排液 FSM 共用此电平
    ⚠ 这三个镜像是沙盒 sensors 合成层的直接依据: 虚拟 PLC 要把 Expand_Waste_Empty_G*
    做成"由排液/抽吸模型驱动"而不是恒 False, 否则 A26 必然走到 402 上限。
