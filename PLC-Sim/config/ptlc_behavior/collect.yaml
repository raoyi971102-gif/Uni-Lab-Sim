# 收集工位 PLC 内部工序编排说明书 (逐字提取自 CODESYS 现役工程 ST)
# 供虚拟 PLC 行为层照抄与漂移看门狗校验; 本文件只记录, 不做任何近似或增补.
schema: ptlc.plc_choreography/v1
station: Collect
codesys_project: 20260702.project
extracted_at: "2026-08-10"

dispatcher:
  pou: Application/50_action/Collect_L2
  sha256: "b08413681a8b0b7a64a426b9fe6519b30ab3c53bfe0714c90c0911e876ca8b1b"
  accepts: [10, 21, 22, 23, 24, 30, 41, 42, 43]
  unknown_code_error: 101
  errors:
    101: "未知动作码: IDLE 接受时 CASE ELSE, Retryable=TRUE, State=30 REJECTED"
    190: "部署/启动门: Start 上升沿且 State=0 时 NOT PLC_Ready 或 PLC_Deploy_State<>0, Retryable=TRUE, State=30"
  notes: |
    协议: Collect_L2_Start 上升沿接受 (AcceptedSeq:=RequestSeq, ActiveCode:=ActionCode, SafeState:=0)
    -> State=10 RUNNING 每扫描调用对应原子 -> 原子置 bActionDone -> CompletedSeq:=AcceptedSeq, State=20 DONE;
    原子置 bActionError -> Retryable:=TRUE, CompletedSeq:=AcceptedSeq, State=40 (ErrorCode 由原子置).
    终态 20/30/40/50: 等 Start 落沿或 Reset 回 IDLE. RUNNING 中 Reset 直接回 IDLE (无 INTERRUPTED 码),
    已置位的输出不清除, 内部步变量到下次接受时才清零. 非 IDLE 收到 Start 上升沿被静默忽略 (无 BUSY 码).
    接受时清零四个内部步变量: 初始化STEP / 准备step / 收集step / 搬运step.
    Collect_L2_Step 只在 IDLE 归零, 所有原子从不写它, OPC 上全程恒 0 (行为层不得为 Collect 编造步进);
    下方各动作 steps 记录的是对应内部步变量的赋值序, 载体变量在各动作注记里点名.
    气缸公共层 (Application/40_Man/PLC_Cyinder_气缸动作, sha256
    0c0f6f682a3f2b2fbfebe59db9e2f4239185690dd617ee4c88225eef7c050877, 按任务要求只记要点不建 spec):
    收集四气缸经 FB_cylinder 驱动, 输出使能都串 PLC_Ready AND (PLC_Deploy_State=0 或 30) AND bDeployCommandsArmed;
    到位反馈超时 tTimeout=T#5S, 超时置 bAlarm 进位图 cyinderAlarm: 下压=bit8, 夹持=bit9, 升降=bit10, 伸缩=bit11;
    xReset 接全局 复位; 报警只进 cyinderAlarm, Collect_L2 不读它, 不影响 L2 状态机 (HMI 侧告警).
    下压气缸只有原点传感器, FB 的动点侧反馈接命令自身 (收集下压气缸手动 OR 自动), 即下压到位=命令回声.
    电磁阀类 (进液/排液/正压排液/瓶定位) 反馈/超时/报警均未接线.
    收集平台瓶子有无传感器 = %IX8.1 (T_BIT_X_1 只读, 20260702 符号导出核对), TRUE=有瓶.

constants:
  pump_init_cmd: "/3Z0,2,2R$R"        # A10 发给 3 号注射泵的初始化指令
  pump_query_cmd: "/3Q$R"             # 泵状态查询指令
  pump_idle_flag: "%MX2005.5"         # 泵空闲位, R_TRIG 取上升沿作完成信号
  pump_forward_len_word: "%MW1300"    # 串口转发长度字, =0 表示转发槽空闲可写
  pump_forward_clear_len: 128         # A30 step20 清转发槽的字面写法 (转发转存:='' 且 %MW1300:=128)
  a30_query_delay_s: 0.5              # ton[1]: 进入收集step=10 后 0.5s 才开始轮询 /3Q
  a30_drain_s: 20                     # ton[2]: 收集step=30 排液计时
  a30_settle_s: 5                     # TON_0: 排液计满后再沉淀 5s 才判定循环去向

actions:
  "10":
    name: A10_init_初始化
    pou: Application/50_action/Collect_L2/A10_init_初始化
    sha256: "5454c83417ddc547695027f5361164495f2a7cc9edeeee96c2b73910c94b49e3"
    kind: composite
    summary: 清全部收集输出位, 初始化 3 号注射泵, 等四气缸原点齐备
    steps:                            # 载体: 程序内变量 初始化STEP (不经 OPC)
      - {step: 0, phase: reset_outputs_send_pump_init}
      - {step: 10, phase: poll_pump_until_idle_edge}
      - {step: 20, phase: wait_four_homes_and_pump}
    gate: {"%MW1300": 0, "泵站位符": false}   # step0 内的等待门 (转发槽空闲且未持泵总线), 不满足时冻结不报错
    errors: {}
    notes: |
      step 0: 清 16 个输出位: 溶液收集瓶定位自动/手动, 收集下压/夹持/升降/伸缩气缸 各 手动+自动,
      收集进液/收集排液/收集正压排液 各 手动+自动; 门成立时 泵站位符:=TRUE,
      转发转存:='/3Z0,2,2R$R', %MW1300:=LEN(转发转存), 转 10.
      step 10: 每当 %MW1300=0 就重发 '/3Q$R' (无节流); R_TRIG[1] 捕到 %MX2005.5 上升沿时
      泵站位符:=FALSE, 泵初始化完成:=TRUE, 转 20. R_TRIG[1] 在动作被调用的每个扫描都评估.
      step 20: 等 收集平台下压气缸原点 AND 收集平台夹持气缸原点 AND 收集平台升降气缸原点
      AND 收集平台推出气缸原点 AND 泵初始化完成; 成立后清 泵初始化完成, 步归 0, bActionDone:=TRUE.
      无错误分支; 任一反馈不来即冻结, 由上位机绝对超时兜底.
      与 plc_collect.yaml collect.init 的 desc 一致, 无出入.
  "21":
    name: A21_夹持夹紧
    pou: Application/50_action/Collect_L2/A21_夹持夹紧
    sha256: "7c869086f62bad87b9bcb3e34a0d0aff9fb0d800c92a11fda1c15c2950fd0b26"
    kind: cylinder
    summary: 夹持气缸夹紧收集器 (上位机已先驱动机器人放收集器)
    steps:                            # 载体: 程序内变量 准备step
      - {step: 0, phase: set_clamp_output}
      - {step: 10, phase: wait_clamp_work_pos}
    gate: {}
    errors: {}
    notes: |
      step 0: 收集夹持气缸自动:=TRUE, 转 10. step 10: 等 收集平台夹持气缸动点, 成立后步归 0, bActionDone.
      线圈 收集夹持气缸 (FB 超时报警 cyinderAlarm.9, 不回传 L2). 无错误分支, 不到位冻结.
      与 plc_collect.yaml collect.clamp 一致.
  "22":
    name: A22_伸缩伸出
    pou: Application/50_action/Collect_L2/A22_伸缩伸出
    sha256: "bf00e14d89f4f63e31c632f31af875bb13b0e76b70e274c94ad0a5282743edd3"
    kind: cylinder
    summary: 伸缩气缸伸出到放瓶位 (要求放瓶位当前无瓶)
    steps:                            # 载体: 程序内变量 准备step
      - {step: 0, phase: gate_then_set_extend_output}
      - {step: 10, phase: wait_push_work_pos}
    gate: {"收集平台推出气缸原点": true, "收集平台瓶子有无传感器": false}
    errors: {}
    notes: |
      瓶互锁原文 (step 0): IF 收集平台推出气缸原点 AND NOT 收集平台瓶子有无传感器 THEN
      收集伸缩气缸自动:=TRUE; 准备step:=10; END_IF. 传感器 TRUE=有瓶 (%IX8.1);
      伸出要求"无瓶", 不满足时冻结在 step 0, 无错误码无 PLC 超时, 由上位机绝对超时兜底.
      step 10: 等 收集平台推出气缸动点, 成立后步归 0, bActionDone.
      注意命名不对称: 输出叫 收集伸缩气缸自动, 反馈叫 收集平台推出气缸原点/动点 (同一气缸).
      线圈 收集伸缩气缸 (FB 超时报警 cyinderAlarm.11). 与 plc_collect.yaml collect.extend 一致.
  "23":
    name: A23_缩回升降下压
    pou: Application/50_action/Collect_L2/A23_缩回升降下压
    sha256: "03458fdfd7b25aadceec6ae1948d205a6564df0915476869caddcf94e4476e71"
    kind: cylinder
    summary: 伸缩缩回 -> 缺瓶判定 -> 升降上升 -> 下压 (下压不等到位)
    steps:                            # 载体: 程序内变量 准备step
      - {step: 0, phase: clear_extend_output}
      - {step: 10, phase: check_bottle_then_lift}
      - {step: 20, phase: wait_lift_then_press_done}
    gate: {"收集平台推出气缸原点": true, "收集平台瓶子有无传感器": true}
    errors:
      201: "缺瓶: 伸缩缩回到原点的判定扫描上 收集平台瓶子有无传感器=FALSE; 上位机重放瓶后重调"
    notes: |
      step 0: 收集伸缩气缸自动:=FALSE, 转 10.
      step 10 (缺瓶 201 的判定时机): 在 收集平台推出气缸原点 成立的扫描上判瓶, 缩回未到位前不判定:
      有瓶 -> 收集升降气缸自动:=TRUE, 转 20; 无瓶 -> 步归 0, Collect_L2_ErrorCode:=201, bActionError:=TRUE.
      step 20: 等 收集平台升降气缸动点; 成立后 收集下压气缸自动:=TRUE 并立即 bActionDone,
      不等待下压到位 (下压无动点传感器, FB 动点反馈=命令回声).
      线圈: 收集升降气缸 (报警 cyinderAlarm.10), 收集下压气缸 (报警 cyinderAlarm.8, 仅原点侧有效).
      与 plc_collect.yaml collect.lift_press 一致 (desc 同样写明 DONE 只表示下压命令已置位).
  "24":
    name: 内联_溶液收集瓶定位
    pou: Application/50_action/Collect_L2
    sha256: "b08413681a8b0b7a64a426b9fe6519b30ab3c53bfe0714c90c0911e876ca8b1b"
    kind: instant
    summary: 直写瓶定位气缸目标态并同扫描完成 (遗留通道)
    steps: []
    gate: {}
    errors: {}
    notes: |
      内联在派发器 RUNNING CASE 24 分支, 无独立 POU (sha256 同派发器):
      溶液收集瓶定位自动 := Collect_BottleLocate_Target; bActionDone:=TRUE. 不读任何反馈.
      与 config 出入 (以 ST 为准): plc_collect.yaml 未登记 collect 动作码 24;
      上位机别名 collect.bottle_locator 实际走 StagingA_L2 动作码 25, 与本码写同一个输出位
      溶液收集瓶定位自动 (cyinder_date 为全局变量表, 带/不带前缀同一变量),
      线圈 溶液收集瓶工位定位气缸, 无反馈无报警. 本码为 PLC 侧仍接受的遗留通道, 照记.
  "30":
    name: A30_collect_收集
    pou: Application/50_action/Collect_L2/A30_collect_收集
    sha256: "7d384744d824fdfdd190427c885bc766a9fd7dbb3cef8529f81f1f90fd3e3e41"
    kind: pump_seq
    summary: 进液 + 注射泵转发 -> 排液 20s + 沉淀 5s, 循环 collect_count 次
    steps:                            # 载体: 程序内变量 收集step; 30 判定后回 0 循环或转 40
      - {step: 0, phase: open_intake_send_pump_cmd}
      - {step: 10, phase: poll_pump_until_idle_edge}
      - {step: 20, phase: switch_to_drain_single_scan}
      - {step: 30, phase: drain_then_settle_decide}
      - {step: 40, phase: close_drain_done}
    gate: {"%MW1300": 0, "泵站位符": false}   # step0 内的泵总线等待门
    errors: {}
    notes: |
      计时器 (动作被调用的每个扫描评估): ton[1](IN:=收集step=10, PT:=T#0.5S);
      ton[2](IN:=收集step=30, PT:=T#20S); TON_0(IN:=ton[2].Q, PT:=T#5S); R_TRIG[5](CLK:=%MX2005.5).
      step 0: 若 collect_forward_instructions<>'' 则 收集进液自动:=TRUE (进液阀开);
      门成立时 转发转存:=collect_forward_instructions, %MW1300:=LEN, 泵站位符:=TRUE, 转 10.
      照记: 指令为空串时不开进液阀但仍占泵总线进 step 10 等空闲沿.
      step 10: ton[1] 计满 0.5s 后, 每当 %MW1300=0 重发 '/3Q$R'; 捕到 %MX2005.5 上升沿
      -> 泵站位符:=FALSE, 转 20.
      step 20 (单扫描): 转发转存:=''; %MW1300:=128; 收集进液自动:=FALSE;
      收集排液自动:=TRUE; 收集正压排液自动:=TRUE; 收集计数:=收集计数+1; 转 30.
      step 30: 排液 20s 计满后 TON_0 再计 5s 沉淀 (每轮排液相位合计 25s; ST 注释: 沉淀完成才判定,
      杜绝误回 step0); TON_0.Q 时: 收集计数>=collect_count -> 收集计数:=0, 转 40;
      否则清 收集排液自动/收集正压排液自动, 回 0 再循环.
      step 40: 清 收集排液自动/收集正压排液自动, 步归 0, bActionDone.
      循环次数: collect_count (上位机写入的通道变量, 非常量); 轮内计数器: 收集计数;
      collect_forward_instructions 为上位机预编译的注射泵指令串.
      阀-线圈映射 (PLC_Cyinder): 收集进液自动 -> 收集平台进液2通电池阀;
      收集排液自动 -> 收集平台排液3通电池阀; 收集正压排液自动 -> 收集平台正压排液阀; 均无反馈无报警.
      无错误分支 (缺瓶/阀反馈/泵错误都不在本原子里); 泵不空闲即冻结, 上位机超时兜底.
      与 plc_collect.yaml collect.collect 一致 (每轮 25s 口径相同); desc 未提 %MW1300:=128 清槽写法, 以 ST 为准.
  "41":
    name: A41_复位伸出
    pou: Application/50_action/Collect_L2/A41_复位伸出
    sha256: "1d4ebf2b9cb949b38ef67c4b2db9e6c59c46ed5d3c0308e5fe2959f3f888ddc1"
    kind: cylinder
    summary: 复位下压 -> 复位升降 -> 伸缩伸出到取瓶位
    steps:                            # 载体: 程序内变量 搬运step (注意有 step=5)
      - {step: 0, phase: clear_press_output}
      - {step: 5, phase: wait_press_home_clear_lift}
      - {step: 10, phase: wait_lift_home_set_extend}
      - {step: 20, phase: wait_push_work_pos}
    gate: {}
    errors: {}
    notes: |
      step 0: 收集下压气缸自动:=FALSE, 转 5. step 5: 等 收集平台下压气缸原点 -> 收集升降气缸自动:=FALSE, 转 10.
      step 10: 等 收集平台升降气缸原点 -> 收集伸缩气缸自动:=TRUE, 转 20.
      step 20: 等 收集平台推出气缸动点 -> 步归 0, bActionDone. 无错误分支, 不到位冻结.
      与 plc_collect.yaml collect.transport_extend 一致.
  "42":
    name: A42_伸缩缩回
    pou: Application/50_action/Collect_L2/A42_伸缩缩回
    sha256: "19e0ecd6e30fe2c258ed6cf902a6b7da88950b91d48ac08fea37ee82ad41a354"
    kind: cylinder
    summary: 伸缩缩回 (上位机已先驱动机器人取瓶到暂存)
    steps:                            # 载体: 程序内变量 搬运step
      - {step: 0, phase: clear_extend_output}
      - {step: 10, phase: wait_push_home}
    gate: {}
    errors: {}
    notes: |
      step 0: 收集伸缩气缸自动:=FALSE, 转 10. step 10: 等 收集平台推出气缸原点 -> 步归 0, bActionDone.
      无错误分支, 不到位冻结. 与 plc_collect.yaml collect.retract 一致.
  "43":
    name: A43_松夹持
    pou: Application/50_action/Collect_L2/A43_松夹持
    sha256: "bcfda03abf6f86a0df733ad8305e6ef37dfabc4a26695490e138ad394e9a6be9"
    kind: cylinder
    summary: 松开夹持气缸 (上位机已先驱动机器人到收集器位)
    steps:                            # 载体: 程序内变量 搬运step
      - {step: 0, phase: clear_clamp_output}
      - {step: 10, phase: wait_clamp_home}
    gate: {}
    errors: {}
    notes: |
      step 0: 收集夹持气缸自动:=FALSE, 转 10. step 10: 等 收集平台夹持气缸原点 -> 步归 0, bActionDone.
      无错误分支, 不到位冻结. 与 plc_collect.yaml collect.release_clamp 一致.
