# 气缸公共层里与本工位相关的两条事实 (2026-08-13 经 codesys MCP 读现役工程实证).
# 形制照 pump.yaml 的 aggregator: 带 pou+sha256, 自动进漂移看门狗的锚点集。
cylinder_layer:
  pou: Application/40_Man/PLC_Cyinder_气缸动作
  sha256: 0c0f6f682a3f2b2fbfebe59db9e2f4239185690dd617ee4c88225eef7c050877
  verified: true
  summary: 刮板拍照旋转气缸(cylinder_14)的 9X 位置互锁, 与 cylinder_46 被两处共用
  interlocks:
    - mechanism: ps_rotate
      instance: cylinder_14
      # ⚠ 只在**手动位**上串这个条件; 自动位没有它。原文:
      #   xManualExtend := ... AND (刮板拍照旋转气缸手动 AND 刮板轴9XDATE.fActPos>330)
      #   xAutoExtend   := ... AND (刮板拍照旋转气缸自动)
      applies_to: manual_only
      condition: 刮板轴9XDATE.fActPos > 330
  shared_instances:
    - instance: cylinder_46
      members: [smp_3way, ps_vacuum]
      note: |
        cylinder_46 声明一次却被调用两次 (上样点样三通电池阀 与 刮板拍照真空泵),
        后一次调用覆盖前一次的入参 —— 这是现役工程的真实隐患。
        两者的 %QX 输出分开, 且都没接 bAlarm 与到位传感器, 故在上位机可观测面上
        没有后果; 行为层**不得据此编造物理耦合**, 只做同拍命令态冲突计数。
  notes: |
    对仿真的直接含义 (推翻了 2026-08-13 计划稿的一处假设):
      * L2 自动链写的是"自动位", **不过 9X>330 这道门** —— 所以
        photoscrape_process 收尾 (scrape_finish 后 9X 停在 x_min 一侧) 不会被互锁堵住,
        当初预判的"互锁上线会暴露编排缺口"不成立, 不要照那条去改编排。
      * 互锁只影响单点面板的手动写; 沙盒若要复刻, 落点是 run_manual_fsm 的手动位分支。
    另记两个自引用反馈 (点表 note 已注明"PLC 未接该向传感器", 此处是 ST 侧实证):
      收集下压气缸 xPosRetract := 收集下压气缸手动 OR 收集下压气缸自动
      刮板拍照下压气缸 xPosRetract := 刮板拍照下压气缸手动 OR 刮板拍照下压气缸自动
