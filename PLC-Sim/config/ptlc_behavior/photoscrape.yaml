# PhotoScrape 工位 PLC 内部工序记录 (编排说明书)
# 逐字提取自现役 CODESYS 工程 Application/50_action/PhotoScrape_L2 及其 action 子对象的 ST 全文.
# 用途: 虚拟 PLC 行为层照抄 + 漂移看门狗 (sha256 逐字校验, 任一 POU 变更即失配).
# 本工位特性: 全部原子从不写 PhotoScrape_L2_Step (仅派发器 IDLE 态清 0), 步进遥测恒 0 对看门狗静默;
# 真实步进走 POU 局部变量 初始化step/拍照step/刮板收集step/alignstep (见各动作 step_var).
schema: ptlc.plc_choreography/v1
station: PhotoScrape
codesys_project: 20260702.project
extracted_at: "2026-08-10"

dispatcher:
  pou: Application/50_action/PhotoScrape_L2
  sha256: ad01f6fc0ca33cd9a2b33430fe127935465f94d8b6766ab6fd41e0a63d321688
  accepts: [10, 31, 32, 33, 34, 35, 36, 40, 41, 42, 43, 44, 51, 52]
  unknown_code_error: 101          # IDLE CASE ELSE: Retryable=TRUE, State=30 (REJECTED)
  start_gate:                      # 受理前全局部署门, 在状态机 CASE 之前, 命中即 RETURN
    condition: "L2_StartTrig.Q AND (PhotoScrape_L2_State=0) AND ((NOT PLC_Ready) OR (PLC_Deploy_State<>0))"
    error_code: 190
    retryable: true
    next_state: 30
  states:
    "0": IDLE
    "10": RUNNING
    "20": DONE
    "30": REJECTED
    "40": ERROR
    "50": TERMINAL_NO_WRITER       # 终态 CASE 列出 50 但本 POU 无处写入它
  notes: |-
    受理: PhotoScrape_L2_Start 上升沿 (R_TRIG) 且 State=0; 写 AcceptedSeq/ActiveCode,
    清 ErrorCode/Retryable/bActionDone/bActionError, 四个内部 step 变量清零,
    PhotoScrape_L2_SafeState:=0, State:=10 (RUNNING).
    受理同时 CNC_AbortLatch:=FALSE (解除上一次中止留下的 CNC 刹车). 单写者纪律:
    CNC停止 的写者只有 PLC_MainPRG 闸门块 (每扫描先于本 POU 运行), 本 POU 不直接写它.
    RUNNING 中 PhotoScrape_L2_Reset: State:=0 即刻中止 (原子被半途抛弃, 已写输出保持);
    PLC_MainPRG 闸门块据同一 Reset 置 CNC_AbortLatch (刹车挂到下次受理, 不能只亮一扫描).
    完成路径: 原子置 bActionDone -> CompletedSeq:=AcceptedSeq, State:=20 (DONE);
    原子置 bActionError -> Retryable:=TRUE, CompletedSeq, State:=40 (ERROR, ErrorCode 由原子先置).
    终态 20/30/40/50: 等 Start 落沿或 Reset 回 IDLE.
    accepts 与 host 配置层出入: 36 与 51 被派发器受理, 但
    eit_ptlc/config/actions/04_photoscrape/plc_photoscrape.yaml 未暴露二者
    (36 见动作 "36" notes; 51 由 press_cylinder(33, pressed=false) 覆盖同一物理动作),
    host 侧仅 12 个动作.
    拍照step 由 A34/A35 共享; 受理与 A10 step0 都会将其清零.

constants:
  # -- 轴目标字面量 (ST 内联字面量, 非 VAR CONSTANT) --
  cam_x335_target: 335             # 9X 放板/上料/停放位; A10 step10, A31, 内联43 step10 同值
  photo_8y_home: 0                 # 8Y 回零目标; A10 step20, A35 step10, 内联43 step20
  scrape_10z_home: 0               # 10Z 抬起目标; A10 step6, 内联43 step5
  # -- 对位检查守卫常量 (派发器 VAR CONSTANT, 42/43/44 用) --
  ALIGN_Z_XY_GATE: 6.0             # Z 高门: 一切 XY 移动只在 10Z fActPos < 6.0; 与 伺服调用 里 9X/8Y 硬互锁同值同哲学
  ALIGN_Z_CHECK_MAX: 18.0          # = 板面 20.5 - 余隙 2.5, 恒 < 20.5 永不触板 (ST 注释, 上机核对过)
  ALIGN_X_WIN_MIN: 0.0             # 板区 XY 软限位窗现值: MIN > MAX = 空集安全占位 (待上机 jog 实测回填);
  ALIGN_X_WIN_MAX: -1.0            # 回填前 42 与 44 降向"现役即拒" (恒 422/424), 见对应动作 notes
  ALIGN_Y_WIN_MIN: 0.0
  ALIGN_Y_WIN_MAX: -1.0
  ALIGN_FRAME_KX: 1.0              # 帧变换占位: axis = K*Target + O, 现值恒等 (上机核实 CNC 帧后回填)
  ALIGN_FRAME_OX: 0.0
  ALIGN_FRAME_KY: 1.0
  ALIGN_FRAME_OY: 0.0
  ALIGN_VEL_XY: 40.0               # 42 显式保守速度 (mm/s), 不靠持久 DATE.fVelocity
  ALIGN_VEL_Z: 5.0                 # 44 慢速缓降; 对齐工程既有唯一速度字面量 (伺服一键回原点退避)

actions:
  "10":
    name: A10_init_初始化
    pou: Application/50_action/PhotoScrape_L2/A10_init_初始化
    sha256: bd62c080fa44eb0c7196b33079ad3e1307e7a6bcb1b8341af7944cef8478d70b
    kind: composite
    summary: 清 7 个执行件全部手/自动输出与交接标志, 再按 10Z->0, 9X->335, (遮光上位门) 8Y->0 顺序归位.
    step_var: 初始化step
    steps:
      - {step: 0, phase: clear_all_outputs_and_handshake_flags}
      - {step: 5, phase: clear_axis_moveabs_residue}
      - {step: 6, phase: z10_moveabs_to_0}
      - {step: 10, phase: x9_moveabs_to_335}
      - {step: 20, phase: shade_upper_gate_then_y8_moveabs_to_0}
    gate:
      shade_upper_before_8y: "step 20 要求输入 刮板拍照遮光气缸上位 = TRUE 才写 8Y 目标; 不满足原地等待, 无错误码"
    errors: {}
    notes: |-
      step 0 清零 7 执行件 x (手动+自动) 共 14 路输出: 刮板拍照真空, 刮板拍照无刷电机,
      刮板拍照定位气缸, 粉末收集器定位, 刮板拍照遮光气缸, 刮板拍照旋转气缸,
      刮板拍照下压气缸; 同时清 拍照step/刮板收集step 与 4 个交接标志
      (Camera_scraper_initialization_OK, Photo_preparation_completed_OK,
      Scraper_collection_completed, Robot_completes_material_retrieval).
      "机器人取物料step:=0" 一行在 ST 里已被注释.
      轴序: step 5 先撤三轴 xMoveAbs 残留 (10Z/9X/8Y); step 6 10Z->0 (bAbMoveDone 后撤令);
      step 10 9X->335; step 20 遮光门通过后 8Y->0, 完成时置
      Camera_scraper_initialization_OK:=TRUE 并 bActionDone.
      遮光门语义: 遮光 手/自动 输出已在 step 0 清零 (气缸应回上位), step 20 等的是实际
      反馈输入; 反馈不来则永卡在 8Y 移动前, PLC 无错误分支, 由上位机超时.
      被清零执行件均不读反馈. 与 host plc_photoscrape.yaml desc 一致, 无冲突.

  "31":
    name: A31_cam_移轴335
    pou: Application/50_action/PhotoScrape_L2/A31_cam_移轴335
    sha256: 2f83df92764fd05031ec202abf68fd7c5b9ba7aa9a73ca983e1213965dd910f1
    kind: axis_seq
    summary: 刮板 9X 绝对移动到 335 (放板/上料让位), bAbMoveDone 后撤令 DONE.
    steps: []
    gate: {}
    errors: {}
    notes: |-
      无内部 step 变量: 每扫描重写 刮板轴9XDATE.fAbsTarget:=335 与 xMoveAbs:=TRUE,
      直到 bAbMoveDone 撤 xMoveAbs 并 bActionDone. 无前置门, 无错误分支,
      伺服不到位由上位机超时. 与 host desc 一致.

  "32":
    name: A32_cam_定位
    pou: Application/50_action/PhotoScrape_L2/A32_cam_定位
    sha256: d2a7e553736b2ca14914277b65eea960ea37cfff7cff224a15d1cf30178edc42
    kind: cylinder
    summary: 定位气缸目标态直写, 同扫描 DONE, 不读反馈.
    steps: []
    gate: {}
    errors: {}
    notes: |-
      刮板拍照定位气缸自动 := PhotoScrape_CamLocate_Target; bActionDone:=TRUE.
      双态执行件: TRUE=夹紧, FALSE=松开. 不读原点/动点反馈, DONE 只表示输出已写入.
      与 host desc 一致.

  "33":
    name: A33_cam_下压
    pou: Application/50_action/PhotoScrape_L2/A33_cam_下压
    sha256: 7ca4c7fd01ccd1fc178addadeedd542bb88b587ef0eb61f47f7e99d2182ea759
    kind: cylinder
    summary: 下压气缸双向不对称, TRUE 置位即同扫描 DONE, FALSE 清位后等上位反馈才 DONE.
    steps: []
    gate: {}
    errors: {}
    notes: |-
      IF PhotoScrape_CamPress_Target THEN 刮板拍照下压气缸自动:=TRUE 且同扫描 DONE
      (不等下位反馈); ELSE 清输出并等输入 刮板拍照下压气缸上位 = TRUE 才 DONE.
      FALSE 分支与 A51_取料松压 逐字同义. 释放不到位由上位机超时;
      下压方向 PLC 不提供到位错误. 与 host desc 一致.

  "34":
    name: A34_cam_相机位
    pou: Application/50_action/PhotoScrape_L2/A34_cam_相机位
    sha256: 184b156ec0685984cb319c56da29bbeef45e925dbcc3e25f9566c22d00337672
    kind: composite
    summary: 遮光上位门内 8Y 移到 Photo_8Y_Target, 到位后遮光下, 等下位反馈 DONE (拍照本身归上位机).
    step_var: 拍照step
    steps:
      - {step: 0, phase: shade_upper_gate_then_y8_moveabs_to_photo_target}
      - {step: 10, phase: y8_done_then_shade_down_cmd}
      - {step: 20, phase: wait_shade_lower_feedback}
    gate:
      shade_upper_before_8y: "step 0 要求 刮板拍照遮光气缸上位 = TRUE 才动 8Y; 不满足原地等待, 无错误码"
    errors: {}
    notes: |-
      8Y 目标来源: 平铺全局变量 Photo_8Y_Target (上位机按 ref_8y 点位在触发前写入,
      值源 points/plc/photo.yaml), 不是 HMI 数组; ST 内保留被注释的旧硬编码
      "拍照轴8YDATE.fAbsTarget:=420". 8Y 到位撤令后 刮板拍照遮光气缸自动:=TRUE (遮光下),
      等输入 刮板拍照遮光气缸下位 = TRUE 才 DONE. 相机曝光不在本动作,
      由上位机视觉控制器承接. 拍照step 与 A35 共享 (受理与 A10 step0 都会清零).
      无错误分支, 卡滞由上位机超时. 与 host desc 一致.

  "35":
    name: A35_cam_回零
    pou: Application/50_action/PhotoScrape_L2/A35_cam_回零
    sha256: ad93f9f1ffea6a6c35e8d55f8df0d9a1ca235aecc2bb35f050d7a853aa8c09d0
    kind: composite
    summary: 清遮光输出 (遮光上), 等上位反馈后 8Y 回 0, bAbMoveDone 后 DONE.
    step_var: 拍照step
    steps:
      - {step: 0, phase: shade_up_cmd}
      - {step: 10, phase: wait_shade_upper_then_y8_moveabs_to_0}
      - {step: 20, phase: wait_y8_done}
    gate:
      shade_upper_before_8y: "step 10 等 刮板拍照遮光气缸上位 = TRUE 才写 8Y 目标"
    errors: {}
    notes: |-
      step 0 清 刮板拍照遮光气缸自动 (遮光回上); step 10 反馈上位后 8Y->0;
      step 20 bAbMoveDone 撤令 DONE. 拍照step 与 A34 共享. 无错误分支,
      不到位由上位机超时. 与 host desc 一致.

  "36":
    name: 粉末收集器定位_派发器内联
    pou: Application/50_action/PhotoScrape_L2
    sha256: ad01f6fc0ca33cd9a2b33430fe127935465f94d8b6766ab6fd41e0a63d321688
    kind: cylinder
    summary: 粉末收集器定位气缸目标态直写, 同扫描 DONE (派发器 RUNNING CASE 内联单行).
    steps: []
    gate: {}
    errors: {}
    notes: |-
      内联于派发器: "36: 粉末收集器定位自动:=PhotoScrape_PowderCollectorLocate_Target;
      bActionDone:=TRUE;" 无独立 action POU, sha256 同派发器. 不读反馈.
      host 配置层未暴露该码: plc_photoscrape.yaml 无 action_code 36, 且
      test_photoscrape_four_stage_offline 明确断言 powder_collector_locator 不在动作表;
      通道本身在 plc_nodes.yaml 与 OPC 符号表存在 (TRUE=定位, FALSE=松开).

  "40":
    name: A40_scrape_刮取
    pou: Application/50_action/PhotoScrape_L2/A40_scrape_刮取
    sha256: 6b3b4b487e6c0013127b08920f605646ae5222b6487ff95e12bc485d7b52486c
    kind: cnc_blackbox
    summary: 开真空阀+无刷电机并置 CNC启动, 黑盒等待内部 CNC完成 后撤启动 DONE (真空/电机保持开).
    step_var: 刮板收集step
    steps:
      - {step: 0, phase: vacuum_on_motor_on_cnc_start}
      - {step: 10, phase: wait_cnc_done_then_clear_start}
    gate: {}
    errors: {}
    notes: |-
      吸粉动力成对: 刮板拍照真空自动 (真空阀 %QX7.2, 只是通断) 与 刮板拍照无刷电机自动
      (吸力源 %QX7.3) 必须同开; ST 注释明言无刷电机行是从 legacy
      A20_Scraper_collection_刮板收集 移植时遗漏后补回的 (那边被注释, 缺它只开阀无吸力,
      粉末飞溅); A41 侧一直有配对的 FALSE. DONE 时两输出保持 TRUE, 供后续 pass 或
      A41 承接; 多 pass 由上位机循环调用本动作.
      CNC 交接: step 0 置 CNC启动:=TRUE; step 10 等 CNC完成 成立 -> 撤 CNC启动, DONE.
      ST 注释: "CNC启动/CNC完成 为 PLC 内部 SoftMotion 触发线 (保留)".
      CNC完成 的置位者在本提取集不可见: Application/30_Ethercat任务/PLC_CNC 只有声明
      而实现体 0 行 (声明含 SMC_Interpolator, SMC_NCDecoder, SMC_SmoothPath,
      SMC_CheckVelocities, SMC_ControlAxisByPos x3, SMC_TRAFO_Gantry3/SMC_TRAFOF_Gantry3,
      SR, RS 实例, 即 SoftMotion 插补链骨架) -- 这正是 host 侧把 A40 当黑盒计时的依据
      (plc_photoscrape.yaml: stall_timeout 900s, action_timeout 1200s).
      路径/切深/进给 (g_pass_z 等 g_*) 由上位机预写, 本动作不读不写 g_数组.
      中止: 脉冲 PhotoScrape_L2_Reset -> 派发器回 IDLE, PLC_MainPRG 闸门块置
      CNC_AbortLatch -> CNC停止; 下次受理时派发器清 CNC_AbortLatch.
      无错误分支 (不读 CNC 错误码); 全程不写 L2 Step, 对看门狗静默. 与 host desc 一致.

  "41":
    name: A41_scrape_收尾
    pou: Application/50_action/PhotoScrape_L2/A41_scrape_收尾
    sha256: d41083e850e0d1012d592775c4bdb893ed297c70f7f23d62d41994b8805698f8
    kind: instant
    summary: 关真空+关无刷电机+旋转气缸置位翻料, 同扫描 DONE, 不读任何反馈.
    steps: []
    gate: {}
    errors: {}
    notes: |-
      同扫描三写: 刮板拍照真空自动:=FALSE; 刮板拍照无刷电机自动:=FALSE;
      刮板拍照旋转气缸自动:=TRUE (翻转倒料). 定位释放不在本动作,
      由 locate_cylinder(32, FALSE) 统一处理 (ST 注释). 与 host desc 一致.

  "42":
    name: align_move_对位XY_派发器内联
    pou: Application/50_action/PhotoScrape_L2
    sha256: ad01f6fc0ca33cd9a2b33430fe127935465f94d8b6766ab6fd41e0a63d321688
    kind: axis_seq
    summary: 守卫通过后 9X/8Y 以 40 mm/s 同动到帧变换后的 Target, 双轴到位恢复速度并停在原地不回零.
    step_var: alignstep
    steps:
      - {step: 0, phase: clear_moveabs_then_guards_then_move_xy}
      - {step: 10, phase: wait_both_done_restore_velocity}
    gate:
      z_gate: "刮板轴10ZDATE.fActPos < ALIGN_Z_XY_GATE(6.0), 违者 421"
      shade_upper: "刮板拍照遮光气缸上位 = TRUE, 违者 425"
      xy_window: "帧变换后 align_tx/align_ty 须落在 ALIGN_X/Y_WIN 窗内, 违者 422 (现值空集恒触发)"
    errors:
      "421": Z 非零位禁 XY 移动, 先 align_z(0) 抬起
      "425": 遮光未上位, 8Y 硬互锁不放行, 先 cam_photohome(35)
      "422": XY 目标在板区软限位窗外 (窗未实测回填前恒拒动, 安全默认)
    notes: |-
      内联于派发器 (codesys-mcp 无法新建 action POU), sha256 同派发器.
      步序: step 0 先照 A10 step5 惯例撤三轴 xMoveAbs 残留, 依次过 Z 门与遮光门,
      再做帧变换 align_tx := ALIGN_FRAME_KX * PhotoScrape_Align_TargetX + ALIGN_FRAME_OX
      (Y 同构; 现值恒等占位, 上机核实 CNC 帧后回填 K/O), 过窗校验后:
      暂存 9X/8Y 持久 DATE.fVelocity -> 显式改 ALIGN_VEL_XY=40.0 ->
      双轴写 fAbsTarget 并置 xMoveAbs. step 10 双轴 bAbMoveDone -> 撤令,
      恢复暂存速度, DONE (停在目标, 不回零).
      Reset 中止时速度不恢复 = 留保守慢速 (ST 注明安全方向).
      现役即拒: ALIGN_X/Y_WIN MIN=0.0/MAX=-1.0 为空集占位, 任何目标必 422;
      现场标定回填前禁止按可用动作编排 (host desc 同口径).
      专动作专用: 不碰 g_数组/收集器轴/气缸/真空/翻料.

  "43":
    name: align_home_对位回零_派发器内联
    pou: Application/50_action/PhotoScrape_L2
    sha256: ad01f6fc0ca33cd9a2b33430fe127935465f94d8b6766ab6fd41e0a63d321688
    kind: axis_seq
    summary: 遮光上位门内按 10Z->0, 9X->335, 8Y->0 顺序 MoveAbsolute 归位, 不走 MC_Home.
    step_var: alignstep
    steps:
      - {step: 0, phase: clear_moveabs_then_shade_upper_guard}
      - {step: 5, phase: z10_moveabs_to_0}
      - {step: 10, phase: x9_moveabs_to_335}
      - {step: 20, phase: shade_interlock_recheck_then_y8_moveabs_to_0}
    gate:
      shade_upper: "step 0 要求 刮板拍照遮光气缸上位 = TRUE, 违者 425; step 20 再次以同条件作 8Y 硬互锁"
    errors:
      "425": 遮光未上位, 8Y 回零会被硬互锁挂死, 先 cam_photohome(35)
    notes: |-
      内联于派发器, sha256 同派发器. Z 已在 0 时 MoveAbsolute(0) 快速完成,
      语义同 "不在 0 先升". 9X 的 "回零" 实为 335 工位停放位, 非机床零 (worklog Q3).
      step 20 时 8Y 硬互锁两条件 (遮光上位 AND Z<6) 均已满足; 真硬互锁在 伺服调用 POU
      (不在本提取集), 动作内的门是同哲学复述. 无窗校验; 除 425 外无错误分支,
      轴不完成由上位机超时. 与 host desc 一致.

  "44":
    name: align_z_对位Z_派发器内联
    pou: Application/50_action/PhotoScrape_L2
    sha256: ad01f6fc0ca33cd9a2b33430fe127935465f94d8b6766ab6fd41e0a63d321688
    kind: axis_seq
    summary: 10Z 以 5 mm/s 慢速绝对移动到 [0,18] 内目标, 降向须 XY 在板区窗内, 完成恢复速度.
    step_var: alignstep
    steps:
      - {step: 0, phase: range_and_window_guards_then_z10_slow_move}
      - {step: 10, phase: wait_done_restore_velocity}
    gate:
      z_range: "0.0 <= PhotoScrape_Align_TargetZ <= ALIGN_Z_CHECK_MAX(18.0), 违者 421"
      xy_window_on_descend: "TargetZ > 0 时 9X/8Y fActPos 须在 ALIGN_X/Y_WIN 窗内, 违者 424 (现值空集恒触发)"
    errors:
      "421": Z 目标越档, 允许 [0, ALIGN_Z_CHECK_MAX]
      "424": 降 Z 前置 XY 须在板区窗内 (窗未回填前恒拒动)
    notes: |-
      内联于派发器, sha256 同派发器. ST 行内注释写 "Z 两档 {0, 检查高度}",
      但守卫代码实为连续区间 [0, 18.0] -- 以代码为准 (host desc 已按连续区间订正).
      ALIGN_Z_CHECK_MAX = 板面 20.5 - 余隙 2.5, 恒不触板 (上机核对过).
      速度: 暂存 10Z 持久 fVelocity -> 显式 ALIGN_VEL_Z=5.0 (对齐工程既有唯一
      速度字面量, 伺服一键回原点退避) -> 完成后恢复.
      现役即拒 (降向): 窗空集使任何 TargetZ>0 必 424, 仅 TargetZ=0 抬升可动
      (host desc 同口径).

