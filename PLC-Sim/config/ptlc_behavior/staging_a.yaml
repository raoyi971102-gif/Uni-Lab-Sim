schema: ptlc.plc_choreography/v1
station: StagingA
codesys_project: 20260702.project
extracted_at: "2026-08-10"

dispatcher:
  pou: Application/50_action/StagingA_L2
  sha256: 9a6f759d08db42c2358377bd477e1e9c0efdba2787db378e99d558af9fb8aeb9
  accepts: [24, 25]
  unknown_code_error: 103
  gate_errors:
    190: 全局部署门 (NOT PLC_Ready 或 PLC_Deploy_State<>0), 在任何物理动作派发前拒绝
    101: BUSY (State<>0 时又来 Start 上升沿)
    102: DUPLICATE_SEQ (RequestSeq <= AcceptedSeq 或 <= CompletedSeq)
    402: RESET_INTERRUPTED (RUNNING 中收到 Reset -> State 50)
  notes: |
    本派发器与 FeedLift/Develop/Collect 那套 (CASE State OF) 写法不同, 是**平铺 IF 链**:
    全局门 -> Reset 分支 -> Start 上升沿受理 -> RUNNING 执行 -> Start 落沿回 IDLE。
    全部 L2 字段挂在 Host_Computer 结构下 (Host_Computer.StagingA_L2_*), 不是平铺全局量。
    ⚠ 与其它工位的三处差异, 行为层必须照抄:
      1. 有 **BUSY(101) 与 DUPLICATE_SEQ(102)** 两道受理前检查 (其它工位没有);
         未知码是 **103** 而不是 101。
      2. Reset 在 RUNNING 中产出 **INTERRUPTED(State 50) + ErrorCode 402**, 而不是静默回 IDLE。
      3. 终态回 IDLE 时清 ActiveCode/Step/ErrorCode/SafeState/Retryable, 但**刻意保留
         CompletedSeq** (清了上位机会丢已完成序号)。
    State 词表: 0=IDLE / 10=RUNNING / 20=DONE / 30=REJECTED / 40=ERROR / 50=INTERRUPTED。

constants: {}

actions:
  "24":
    name: A24_定位A (内联于派发器)
    pou: Application/50_action/StagingA_L2
    sha256: 9a6f759d08db42c2358377bd477e1e9c0efdba2787db378e99d558af9fb8aeb9
    kind: instant
    summary: 把粉末收集器定位气缸写成 StagingA_LocatorA_Target, 同扫描 DONE (不等反馈)
    steps:
      - {step: 1, phase: accepted}
      - {step: 24, phase: write_output}
      - {step: 99, phase: done}
    errors:
      103: RUNNING 中 ActiveCode 落到 ELSE (受理与执行不一致, 正常不可达)
    notes: |
      内联在派发器的 RUNNING 段, 无独立 POU。
      输出: cyinder_date.粉末收集器定位自动 := Host_Computer.StagingA_LocatorA_Target (BOOL 目标态)。
      **不读任何到位反馈**, 写完即在同一扫描置 CompletedSeq/Step=99/State=20。
      行为层: cyl_write(sta_powder_locator, target) 后立即 DONE; 物理反馈由既有
      run_manual_fsm 的 FB_cylinder 复刻 (0.2s 后翻 fb), 但本动作不等它。

  "25":
    name: A25_定位B (内联于派发器)
    pou: Application/50_action/StagingA_L2
    sha256: 9a6f759d08db42c2358377bd477e1e9c0efdba2787db378e99d558af9fb8aeb9
    kind: instant
    summary: 把溶液收集瓶定位气缸写成 StagingA_LocatorB_Target, 同扫描 DONE (不等反馈)
    steps:
      - {step: 1, phase: accepted}
      - {step: 25, phase: write_output}
      - {step: 99, phase: done}
    errors:
      103: RUNNING 中 ActiveCode 落到 ELSE (受理与执行不一致, 正常不可达)
    notes: |
      内联在派发器的 RUNNING 段, 无独立 POU。
      输出: cyinder_date.溶液收集瓶定位自动 := Host_Computer.StagingA_LocatorB_Target。
      与 24 逐字同构, 只换气缸与目标通道。收集工位的瓶位定位缸走这条路
      (plc_collect.yaml 的 collect.bottle_locator(25) 是它的别名, 实体在本工位)。
