    kind: composite
    summary: "旧单次点样: 6X/7Y 到点样起点, 两段泵指令配合 6X 扫线 (泵未完时 6X 起止点往返), 收尾回清洗位并松开上样定位."
    steps:
      - {step: 0, phase: revoke_axis_commands}
      - {step: 1, phase: start_6x_7y_to_spot_start}
      - {step: 5, phase: wait_axes_send_dispense_instr1_valve_on}
      - {step: 10, phase: poll_idle_then_release}
      - {step: 15, phase: air_on_send_instr2_start_sweep_to_end}
      - {step: 20, phase: poll_idle_with_shuttle_subfsm}
      - {step: 30, phase: x6_then_7y_to_wash_pos}
      - {step: 40, phase: wait_7y_release_locate_done}
    gate: {}
    errors: {}
    notes: |
      轴移动序: step1 同发 点样轴6X→Spot_6X_StartTarget 与 点样轴7Y→Spot_7Y_Target (上位机写
      flat OPC 组合点位; 注释遗迹为 HMI_点样轴6X.position[2] 与 HMI_点样轴7Y.position[2], 已弃用);
      step15 6X→Spot_6X_EndTarget 扫线; 收尾 step30 6X→HMI_点样轴6X.position[1] (清洗位),
      到位后 7Y→HMI_点样轴7Y.position[1].
      泵段: step5 占位发 Sampling_dispense_instructions[1] 并三通 TRUE(点样头侧); step10 经
      TON[7] T#0.5S 轮询 '/4Q$R', 空闲沿释放占位; step15 再占位发 instructions[2] 并开上样吹气;
      step20 经 TON[4] T#0.5S 轮询, 空闲沿释放占位并关三通/吹气.
      实现怪癖: step10/20 的 %MX2005.5 空闲沿 (R_TRIG[10]) 判定嵌套在 [%MW1300=0 AND TON.Q]
      轮询门之内, 空闲沿只在轮询门开启的同一扫描被消费.
      往返子状态机 (step20 内嵌 打样伺服移动step, 与轮询同扫描运行): 子步0=等 6X 到位,
