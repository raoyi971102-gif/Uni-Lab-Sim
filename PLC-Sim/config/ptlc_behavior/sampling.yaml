  "62":
    name: A62_单条带点样
    pou: Application/50_action/Sampling_L2/A62_单条带点样
    sha256: 968c6ef16fc0e3bb8c3bcb83fc0bf53f2169e59babd05180e109d32e6c43a762
    kind: composite
    summary: "蛇形双向分程供液点样 (模型B E+B): 每程 A{N}R 供液扫线→到位发 /4T 停泵并并行 /4? 查活塞→吹干往复→按活塞位判终或反向续程, 最多 60 程."
    steps:
      - {step: 0, phase: init_save_velocity_move_to_start}
      - {step: 10, phase: wait_start_pos}
      - {step: 12, phase: pass_guard_acquire_bus_send_run_instr}
      - {step: 15, phase: start_liquid_sweep}
      - {step: 20, phase: wait_sweep_done}
      - {step: 24, phase: send_stop_start_parallel_query}
      - {step: 30, phase: dry_leg1_away_from_stop}
      - {step: 32, phase: wait_dry_leg1}
      - {step: 34, phase: dry_leg2_back_to_stop}
      - {step: 36, phase: wait_dry_leg2_cycle_loop}
      - {step: 38, phase: wait_query_finish_or_flip_dir}
      - {step: 70, phase: x6_to_wash_pos_air_on}
      - {step: 80, phase: wait_x6_then_7y_to_wash_pos}
      - {step: 90, phase: wait_7y_outputs_off_restore_velocity_done}
      - {step: 99, phase: error_hold_inert}
    gate:
      dry_cycles_clamp: "step0 把 Sampling_band_dry_cycles < 1 钳到 1"
      pass_cap: "每程发液前 spot_band_pass_count+1, > 60 即 462"
    errors:
      462: 单带程数超 60 程保险
      465: /4? 并行查询连续无有效帧且重试 >5; 处置为停 6X 轴+关吹气关三通+恢复 6X 速度, 停在惰性步 99 等派发器接管
    notes: |
      本动作是唯一把内部步发布到 Sampling_L2_Step 的原子 (每扫描镜像 spot_band_step).
      轴移动序: step0 保存 6X 原速度 (spot_band_old_6x_velocity) 并防御性释放泵站位符后,
      同发 点样轴6X→Spot_6X_StartTarget 与 点样轴7Y→Spot_7Y_Target; 每程 step15 按
      spot_band_dir 决定 6X 目标 (TRUE: →Spot_6X_EndTarget, FALSE: →Spot_6X_StartTarget),
      第 1 程恒正向 (dir 初值 TRUE); 吹干 leg1 反向离开本程停点, leg2 回停点, 每周期 2 leg,
      共 Sampling_band_dry_cycles 周期; 收尾 6X→HMI_点样轴6X.position[1] →
      7Y→HMI_点样轴7Y.position[1] (与 A60 同收尾位).
      速度覆盖: 液体程用 Sampling_band_spot_speed, 吹干 leg 用 Sampling_band_dry_speed
      (均仅 >0 时写 fVelocity); DONE(step90)/465/派发器 Reset 三处恢复保存速度.
      泵段: step12 占位并发 Sampling_band_run_instruction (A{N}R, 泵朝目标 N 持续供液),
      同时三通 TRUE+吹气 TRUE; step15 等 %MW1300=0 (指令已交串口层) 才起扫线, 扫线期间泵持续
      输液; step24 等 %MW1300=0 发 '/4T$R' 停泵并置 spot_band_query_active 启动并行查询,
      随即转吹干不在停点驻留 (T 送达前后余液被运动摊开).
      并行查询块 (位于 CASE 之前, 与轴运动同扫描执行): %MW1300=0 且未发则清接收字符发 '/4?$R';
      TON[10] 200ms 后解析 ('/0' 扫 0..60 字节, 跳 3 字节连读数字); 有效帧完整归属本事务后才
      释放泵站位符并置 query_done; 无效/未完整响应不得当作"未到目标", 保持占位重发;
      重试计数 >5 走 465 处置.
      判终 (step38): 吹干结束回停点后等 query_done; spot_band_pos <=
      Sampling_band_end_position + 5 则进收尾, 否则 dir 取反直接从当前端发下一程
      (旧回程 step40/42 已删, 蛇形续程).
      462 路径: 置 ErrorCode=462 与 bActionError 且 spot_band_step:=0, 不做输出清理也不恢复
      6X 速度 (三通/吹气维持 TRUE 直到 Reset 或下次派发; 且 IDLE 接受时清
      spot_band_velocity_saved, 保存的原速度被遗忘) — 为逐字提取的现役行为, 仿真须照抄.
      465 停 99 惰性等待, 不发任何运动/输出: 因并行块在 CASE 之前, 直设 step0 会被同周期
      step0 的回程命令穿透撤销急停.
      死锁纪律: xMoveAbs 置位步与 done 消费步一一配对; 泵站位符 自发 A{N}R 起持有至 /4? 有效
      响应; step0 防御性释放泵站位符 (上次非常规中断残留 TRUE 会使 step12 静默死锁).
      完成置 Sampling_Spray_sample_OK (与 A60 同一标志).
      与 plc_sampling.yaml sampling.spot_band_layer desc 一致; desc 的"到端点立即发/4T"在 ST
      中实际为等 %MW1300=0 后发送.
