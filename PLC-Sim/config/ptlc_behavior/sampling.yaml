# Sampling 工位 PLC 编排说明书 — 从 CODESYS 现役工程逐字提取的内部工序记录.
# 用途: 虚拟 PLC 行为层照抄 + 漂移看门狗校验 (sha256 与现役 POU 逐字对应).
# 交叉核对: eit_ptlc/config/actions/01_sampling/plc_sampling.yaml 的 desc; 冲突以 ST 为准并在 notes 点名.
schema: ptlc.plc_choreography/v1
station: Sampling
codesys_project: 20260702.project
extracted_at: "2026-08-10"

dispatcher:
  pou: Application/50_action/Sampling_L2
  sha256: 910e1fb4ad45c9ac9f072e87e6698bb6ac7f4bc9822d5efe4bce20e556ba51d3
  accepts: [10, 20, 31, 32, 33, 40, 50, 55, 60, 61, 62]
  unknown_code_error: 101
  states: {0: IDLE, 10: RUNNING, 20: DONE, 30: REJECTED, 40: ERROR, 50: INTERRUPTED}
  notes: |
    启动门: Start 上升沿且 State=0 时, 若 NOT PLC_Ready 或 PLC_Deploy_State<>0, 置
    ErrorCode=190/Retryable=TRUE/CompletedSeq 并直进 30(REJECTED), 不派发任何物理动作.
    接受: IDLE 收 Start 沿即锁存 AcceptedSeq:=RequestSeq 与 ActiveCode, 清零全部子 step 寄存器
    (初始化/清洗/放硅胶板/上样准备/吸收液体/rinse_mix/点样/喷涂移轴/spot_band 及其 dry_count/
    velocity_saved/query 标志), SafeState:=0, 进 10(RUNNING); 未知码走 ELSE 置 101/Retryable=TRUE 进 30.
    错误回报: 原子置 bActionError 后由派发器统一置 Retryable := (ErrorCode <> 466), 进 40(ERROR).
    RUNNING 中 Reset:
      code=55 (非幂等特护): 先撤销 5Z/4X/3Y 轴命令并关三通阀, 等 %MW1300=0 后发 '/4T$R' 停泵,
      释放泵站位符, Retryable:=FALSE, 进 50(INTERRUPTED); 邮箱非空则本扫描 RETURN 下扫描重试.
      code in {20, 40, 50, 60, 62}: 释放泵站位符.
      code=62 额外: 关三通/吹气, 撤销 6X/7Y 轴命令, 恢复 6X 保存速度, 清 spot_band 步与查询标志.
      非 55 的 Reset 清理后直接回 0(IDLE), 不经 INTERRUPTED.
    终态退出: 20/30/40 在 (NOT Start) OR Reset 时回 IDLE; 50 要求 Start 与 Reset 均撤销
    (避免中断态被同一扫描吞掉).
    子步发布: IDLE 时 Sampling_L2_Step:=0; 仅 A62 每扫描把 spot_band_step 镜像到 Sampling_L2_Step,
    其余动作的内部 step 寄存器不上报.

constants:
  piston_step_max: 6000              # A50 行程闸: /4? 真活塞位 + P 增量 > 6000 即 463
  pump_query_retry_max: 5            # A50/A62 /4? 无效帧重试上限, 计数 >5 报错 (含首发共 6 次查询)
  band_pass_max: 60                  # A62 单带程数保险, 第 61 程触发 462
  band_end_tolerance_steps: 5        # A62 判终: spot_band_pos <= Sampling_band_end_position + 5
  rinse_mix_count_min: 1             # A55 参数下限 (越界 466)
  rinse_mix_count_max: 20            # A55 参数上限 (越界 466)
  band_dry_cycles_min_clamp: 1       # A62 step0 把 Sampling_band_dry_cycles < 1 钳到 1
  pump_poll_interval_s: 0.5          # 各 /4Q 轮询前置 TON 均为 T#0.5S
  pump_query_settle_ms: 200          # /4? 发出后 TON 200ms 再解析 (A50 TON[11] / A62 TON[10])
  p_parse_scan_bytes: 120            # A50 在 instructions[1] 内扫 'P'(16#50) 的下标窗口 0..120
  reply_parse_scan_bytes: 60         # A50/A62 在接收字符内扫 '/0'(16#2F,16#30) 的下标窗口 0..60
  reply_digits_offset: 3             # '/0' 命中后跳 3 字节连读十进制数字
  mailbox_flush_len: 128             # A20 step50 轮界: 转发转存:='' 且 %MW1300:=128 (续轮与完成两分支均执行)
  pump_addr: 4                       # 注射泵地址 (指令 /4 前缀)
  cmd_pump_init: "/4Z0,1,1R$R"       # A10 泵初始化
  cmd_pump_status: "/4Q$R"           # 泵状态查询, 空闲以 %MX2005.5 上升沿判
  cmd_pump_position: "/4?$R"         # 活塞绝对位查询, 响应不带泵地址
  cmd_pump_stop: "/4T$R"             # 停泵 (A62 到位即停 / A55 Reset 停泵)
  serial_mailbox: "%MW1300"          # 共享串口邮箱: 0=空闲, 写入字符串长度即发送
  pump_idle_flag: "%MX2005.5"        # /4Q 空闲响应标志位
  deploy_gate_error: 190             # 启动门失败 (NOT PLC_Ready 或 PLC_Deploy_State<>0)
  nonretryable_error_code: 466       # 派发器 Retryable := (ErrorCode <> 466)

actions:
  "10":
    name: A10_init_初始化
    pou: Application/50_action/Sampling_L2/A10_init_初始化
    sha256: 7fed194ac92ebc6d5b349e085f10e1ec2c0a98c6be52ad229b70e5fcf55dbf06
    kind: composite
    summary: 复位阀与状态位, 5Z 先回零再 4X/6X/7Y 同回零, 最后对 4 号注射泵发初始化命令并轮询至空闲.
    steps:
      - {step: 0, phase: reset_outputs_and_flags}
      - {step: 5, phase: z5_home_then_start_xy_home}
      - {step: 6, phase: wait_all_axes_home}
      - {step: 10, phase: pump_init_send}
      - {step: 20, phase: pump_init_poll_idle}
      - {step: 30, phase: set_ok_and_done}
    gate: {}
    errors: {}
    notes: |
      轴移动序: step5 先令 上样轴5Z轴 到 0 (置目标+xMoveAbs, 等 bAbMoveDone), 到位后同扫描把
      点样轴7Y/点样轴6X/上样轴4X 目标置 0 并同时起动; step6 等四轴 bAbMoveDone 齐后撤销命令.
      3Y 特例: step0 把 打样瓶上料轴3YDATE.fAbsTarget 写 0 且撤销 xMoveAbs, 但全程从不命令 3Y
      移动 — 仿真侧不得动 3Y.
      step0 复位: 上样定位/上样点样三通电池阀/上样吹气 的手动与自动输出, Sampling_Spray_sample_OK/
      Sampling_liquid_absorption/Sampling_preparation_OK, 大真空泵站位[11], 清洗计数与
      清洗/放硅胶板/上样准备/吸收液体/点样 各子 step.
      泵段: step10 在 %MW1300=0 且未持泵站位符时占位并发 '/4Z0,1,1R$R'; step20 每当 %MW1300=0
      重发 '/4Q$R', 以 %MX2005.5 上升沿 (R_TRIG[1]) 判空闲后释放占位; step30 置
      Sampling_initialization_OK 并 DONE.
      无显式错误分支, 轴或泵停滞由上位机超时判定. 与 plc_sampling.yaml sampling.init desc 一致.

  "20":
    name: A20_clean_清洗
    pou: Application/50_action/Sampling_L2/A20_clean_清洗
    sha256: f8f37b319ff625ba35925582711613634adeb46c4ecbab2c7b2ba72aeb01cfd1
    kind: composite
    summary: 轴进清洗位后按 Sampling_clean_mode 分支; mode=0 重清洗按 Sampling_clean_count 循环三段泵指令, mode=1 轻清洗充液固定两段并在 entry 边界切三通.
    steps:
      - {step: 0, phase: revoke_axis_commands}
      - {step: 2, phase: z5_home}
      - {step: 5, phase: start_6x_and_4x_to_wash}
      - {step: 6, phase: wait_4x_then_z5_down}
      - {step: 7, phase: wait_z5_6x_then_branch_mode}
      - {step: 10, phase: heavy_send_instr1_valve_spot_side}
      - {step: 20, phase: heavy_poll_idle_then_valve_needle_side}
      - {step: 24, phase: heavy_resend_instr1}
      - {step: 26, phase: heavy_poll_idle}
      - {step: 30, phase: heavy_send_instr2}
      - {step: 40, phase: heavy_poll_idle}
      - {step: 50, phase: heavy_cycle_count_or_finish}
      - {step: 60, phase: zero_count_finish}
      - {step: 110, phase: light_send_instr1_valve_needle_side}
      - {step: 120, phase: light_poll_idle_then_valve_spot_side}
      - {step: 130, phase: light_send_instr2}
      - {step: 140, phase: light_poll_idle_reset_valve_finish}
    gate: {}
    errors: {}
    notes: |
      共用轴前奏 (双模式相同): step2 5Z→0; step5 同发 点样轴6X→HMI_点样轴6X.position[1] 与
      上样轴4X→Sampling_4X_WashTarget (OPC flat 变量; 注释遗迹为 HMI_上样轴4X轴.position[9],
      已弃用), 清洗计数清零; step6 只等 4X 到位即下压 5Z→HMI_上样轴5Z轴.position[1];
      step7 等 5Z 与 6X 齐后分支.
      分支: Sampling_clean_mode=1 → 110; 否则 Sampling_clean_count>0 → 10, <=0 → 60
      (不发泵指令直接置 OK 并 DONE).
      mode=0 重清洗每轮: instr[1] 配三通 TRUE(点样头侧) → /4Q 空闲后三通 FALSE(上样针侧) 并再发
      instr[1] → /4Q → instr[2] → /4Q → step50 清洗计数+1. 计数未满回 10 续轮, 满则置
      Sampling_Cleaning_OK 并 DONE; 两分支均在轮界执行邮箱冲刷 (转发转存:='' 且 %MW1300:=128)
      且三通 FALSE.
      mode=1 轻清洗 (spec 2026-07-14-sampling-light-flush): 不进 count 循环; instr[1] 配三通
      FALSE(上样针侧, 吸满+充上样流路+冲外壁链式) → /4Q 确认泵空闲后切三通 TRUE(点样头侧) →
      instr[2] (冲点样头至 A0) → /4Q 确认后三通复位 FALSE, 置 Sampling_Cleaning_OK 并 DONE.
      Sampling_clean_mode 由上位机每次派发显式写 (0=重清洗现行/1=轻清洗), PLC 只读不复位.
      /4Q 轮询节流: 各段发送后经 T#0.5S TON 才开始重发查询 (TON[1]/[8]/[6] 与 [3]/[9] 分段专用),
      空闲以 %MX2005.5 上升沿判 (R_TRIG[2]/[11]/[12] 与 [4]/[5] 分段专用).
      无显式错误分支. 与 plc_sampling.yaml sampling.clean (mode=0) 与 sampling.flush (mode=1)
      desc 一致; desc 未提及 count<=0 的 step60 空转分支与轮界 %MW1300:=128 邮箱冲刷.

  "31":
    name: A31_放板移轴
    pou: Application/50_action/Sampling_L2/A31_放板移轴
    sha256: 84101e6a09fd24c7c7f8298dbec9c3d0f25f90a89db4b6c686ff3409880b80cb
    kind: axis_seq
    summary: 点样 7Y 轴移到放板位, 供上位机随后驱动机器人放板.
    steps:
      - {step: 0, phase: start_7y_to_place_pos}
      - {step: 10, phase: wait_7y_done}
    gate: {}
    errors: {}
    notes: |
      唯一轴移动: 点样轴7Y → HMI_点样轴7Y.position[1] (放板位示教值). 上位机 OPC 读不到该示教
      数组, 仿真侧对 7Y 目标按 "HMI_点样轴7Y.position[1]" 记名处理, 不得代以数值.
      到位后撤销 xMoveAbs 即 DONE. 无错误分支.
      与 plc_sampling.yaml sampling.place_axis desc 一致.

  "32":
    name: A32_放板定位
    pou: Application/50_action/Sampling_L2/A32_放板定位
    sha256: ed80376597bc5bc7e647ea98e91fcf116c655fc7e1c119e2db27d47fa5f91f7e
    kind: cylinder
    summary: 置位上样定位气缸夹紧硅胶板, 同一扫描周期 DONE.
    steps: []
    gate: {}
    errors: {}
    notes: |
      无步进状态机: 单扫描顺序执行 上样定位自动:=TRUE; Sampling_Place_materials_OK:=TRUE;
      bActionDone:=TRUE. 不等待气缸到位反馈, DONE 只代表输出已写入.
      与 plc_sampling.yaml sampling.place_locate desc 一致.

  "33":
    name: A33_定位松开
    pou: Application/50_action/Sampling_L2/A33_定位松开
    sha256: 912bf2adaccbd730e5587f2ee4224f4c2aff3e680c2ccfc614eafa39dfec319b
    kind: cylinder
    summary: 松开上样定位气缸释放硅胶板, 同一扫描周期 DONE; 镜像 A32.
    steps: []
    gate: {}
    errors: {}
    notes: |
      无步进状态机: 单扫描顺序执行 上样定位自动:=FALSE; bActionDone:=TRUE.
      与 A32 的差异: 不置任何 OK 状态位. 不等待气缸原位反馈.
      与 plc_sampling.yaml sampling.place_release desc 一致.

  "40":
    name: A40_prep_上样准备
    pou: Application/50_action/Sampling_L2/A40_prep_上样准备
    sha256: ac17dfe385481e9060076724a192ad59a391eff9675fb4697effbca48ccde987
    kind: composite
    summary: 5Z 抬到 0 后发 Sampling_prep_instructions[1] 绝对回抽蓄驱动液, /4Q 空闲即 DONE.
    steps:
      - {step: 0, phase: z5_home}
      - {step: 1, phase: send_prep_instr1}
      - {step: 2, phase: poll_idle_then_done}
    gate: {}
    errors: {}
    notes: |
      轴移动序: 仅 5Z→0 (针尖离液悬空), XY 不动. 泵段: step1 占位后仅发 instructions[1]
      (自口 3 绝对回抽至 A{n}, DT 指令由上位机翻译写入); step2 经 TON[2] T#0.5S 后轮询 '/4Q$R',
      %MX2005.5 上升沿 (R_TRIG[3]) 释放占位, 置 Sampling_preparation_OK 并 DONE.
      instructions 数组其余下标不使用. 无错误分支.
      与 plc_sampling.yaml sampling.prep desc 一致 (一次回抽两端同时成立: 泵腔侧存清洗液,
      针尖侧成等量空气段, 现行流程按气隔断语义消费).

  "50":
    name: A50_absorb_吸收液体
    pou: Application/50_action/Sampling_L2/A50_absorb_吸收液体
    sha256: 15ec1d4fbf47c401dfa8c40ac53bd1eb826d93a92f85dec6de920e98b731e305
    kind: composite
    summary: Z 回零后在空气中建气隔断, XY 到孔位下针, 解析 P 增量并以 /4? 真活塞位做 6000 步行程闸, 相对回抽后安全抬针.
    steps:
      - {step: 0, phase: z5_home}
      - {step: 2, phase: air_gap_send_or_skip}
      - {step: 3, phase: air_gap_poll_then_release_bus}
      - {step: 8, phase: start_xy_to_well}
      - {step: 10, phase: wait_xy_then_z5_down}
      - {step: 20, phase: wait_z5_parse_p_steps}
      - {step: 22, phase: acquire_bus_send_piston_query}
      - {step: 23, phase: parse_piston_and_stroke_check}
      - {step: 24, phase: requery_within_bus_hold}
      - {step: 25, phase: send_relative_aspirate}
      - {step: 30, phase: poll_idle_then_release_bus}
      - {step: 40, phase: z5_home_set_ok_done}
      - {step: 90, phase: error_lift_z5_then_report}
    gate:
      p_instruction: "instructions[1] 必须解析出 P<n> 且 n>0, 否则 463"
      stroke: "/4? 真活塞位 + n <= 6000, 越界 463"
    errors:
      463: P 指令解析无效 (无 P<n> 或 n<=0) 或行程越界 (真活塞位+n > 6000)
      464: /4? 连续无有效帧, 重试计数 >5 (含首发共 6 次查询)
    notes: |
      轴移动序: 5Z→0 → (气隔断泵段) → 上样轴4X→Sampling_4X_Target 与
      打样瓶上料轴3Y→Sampling_3Y_Target 同发 → 齐后 5Z→HMI_上样轴5Z轴.position[2] (孔内下针位)
      → 泵段 → 5Z→0. 4X/3Y 目标为上位机按孔位标定写入的 OPC flat 变量, 不取 HMI 数组;
      5Z 下针深取 HMI_上样轴5Z轴.position[2] 示教值.
      气隔断段 (step2/3): Sampling_sample_instructions[2] (绝对 A{gap}) 为空串则整段跳过
      (兼容先调 A40 建立气隔断的旧编排); 非空则必须在移向孔位之前于原位空气中执行 — 吸气前
      针尖内为满液, 带液移动途中挂壁滴液会滴进样品孔稀释样品. 该段用专用
      sample_gap_wait(T#0.5S)/sample_gap_idle 实例轮询 /4Q, 空闲即释放占位再动轴
      (轴移动期间不占共享泵总线). 绝对语义使润洗轮天然幂等: A55 终态活塞已在 A{gap},
      再绝对吸至 A{gap} 为零位移.
      P 解析 (step20): 对 instructions[1] 逐字节扫 'P'(16#50), 下标窗口 0..120, 命中后连读
      十进制数字得相对步数 n; 唯一真源是指令本文, 不依赖 OPC 伴随参数.
      /4? 查询 (step22/23/24): 占位后清接收字符发 '/4?$R', TON[11] 200ms 后解析: 扫 '/0'
      (16#2F,16#30) 下标窗口 0..60, 命中后跳 3 字节连读数字为真活塞位; 响应不带泵地址,
      解析完成前不释放占位; 无效帧在同一占位内重发 (step24), 重试计数 >5 置 464.
      行程闸 (step23): (n<=0) OR (真活塞位+n > 6000) 置 463; n<=0 项为防御性冗余 (step20 已拦).
      发 P<n> (step25): 保持同一占位发送 instructions[1]; step30 经 TON_0 T#0.5S 轮询 '/4Q$R',
      %MX2005.5 上升沿 (R_TRIG[10]) 释放占位.
      错误路径 (step90): 463/464 均先把 5Z 抬到 0 再置 bActionError (安全抬针);
      派发器据 ErrorCode<>466 标 Retryable=TRUE.
      完成置 Sampling_liquid_absorption. TON_1 (IN:=NOT 点样气泡传感器, T#5S) 每扫描求值但
      .Q 从未被消费, 为遗迹代码, 仿真无需实现气泡传感器.
      与 plc_sampling.yaml sampling.aspirate desc 一致.

  "55":
    name: A55_润洗吹打混匀
    pou: Application/50_action/Sampling_L2/A55_润洗吹打混匀
    sha256: f64439c26c34adad97370b181a881b715a2975530409c85b7c2b8c24f5f438c3
    kind: composite
    summary: 回打余量→口1润洗→抬针吸气隔断→下针循环吹打; 四条泵指令一次占位串行执行, 终态活塞停在 A{gap}.
    steps:
      - {step: 0, phase: validate_params_z5_home_start_xy}
      - {step: 10, phase: wait_xy_then_z5_down}
      - {step: 20, phase: wait_z5_valve_needle_side}
      - {step: 30, phase: send_backflush_instr1}
      - {step: 31, phase: poll_idle}
      - {step: 40, phase: send_rinse_instr2}
      - {step: 41, phase: poll_idle}
      - {step: 42, phase: z5_lift_to_air}
      - {step: 43, phase: send_air_gap_instr3}
      - {step: 44, phase: poll_idle}
      - {step: 45, phase: z5_down_to_well}
      - {step: 50, phase: send_mix_instr4}
      - {step: 51, phase: poll_idle_cycle_loop}
      - {step: 60, phase: valve_off_z5_home_done}
    gate:
      rinse_mix_count: "Sampling_rinse_mix_count 必须在 1..20"
      instructions: "Sampling_rinse_mix_instructions[1..4] 均非空"
      violation: "置 466 且动作内自置 Retryable=FALSE, 关三通后直接 bActionError, 不起任何运动"
    errors:
      466: 参数或指令非法 (count 越界或任一指令为空), 不可重试
    notes: |
      轴移动序: step0 校验通过后 5Z→0, 到位同扫描发 上样轴4X→Sampling_4X_Target 与
      打样瓶上料轴3Y→Sampling_3Y_Target (与 A50 同孔位契约, 回到原样品孔); step10 齐后
      5Z→HMI_上样轴5Z轴.position[2]; step42 中途抬 5Z→0 (针尖离液进空气), step45 再下
      position[2]; step60 收尾抬 5Z→0. 三通全程 FALSE (上样针侧), step20 与 step60 显式复位.
      泵段: step30 占位 (泵站位符:=TRUE) 后四条指令共用同一占位, 中间各步只查 %MW1300=0
      不再抢占; [1]=泵腔当前余量经口3回打原孔并回 A0, [2]=口1吸润洗液经口3全部打入原孔并回 A0,
      [3]=口3空气中吸气隔断至 A{gap}, [4]=口3吸至 A{gap+mix} 并打回 A{gap} (气隔断全程保留).
      [4] 按 Sampling_rinse_mix_count 循环 (rinse_mix_cycle 计数); 每条均经共享
      rinse_mix_wait (T#0.5S) + '/4Q$R' + rinse_mix_idle (%MX2005.5 上升沿) 确认空闲;
      循环满在 step51 释放占位, step60 再冗余释放一次.
      Reset 语义 (派发器侧特护): 撤销 5Z/4X/3Y 轴命令并关三通, 等 %MW1300=0 发 '/4T$R' 停泵,
      进 INTERRUPTED; 不自动重发.
      与 plc_sampling.yaml sampling.rinse_mix desc 一致.

  "60":
    name: A60_spray_点样
