schema: ptlc.plc_choreography/v1
station: FeedLift
codesys_project: 20260702.project
extracted_at: "2026-08-10"

dispatcher:
  pou: Application/50_action/FeedLift_L2
  sha256: b79b93a099e5834bf7ce05050169daaf411f87668701346d25ad03ccec156f3f
  accepts: [10, 11, 12, 13, 21, 22, 91]
  unknown_code_error: 101
  gate_errors:
    190: 全局部署门 (NOT PLC_Ready 或 PLC_Deploy_State<>0), 在任何物理动作派发前拒绝
  notes: |
    标准 CASE State OF 派发器: IDLE 受理 (清 初始化step/上料step/下料step 三个步序变量)
    -> RUNNING 每周期调对应原子 -> bActionDone -> DONE(20) / bActionError -> ERROR(40)
    -> 终态等 Start 落沿或 Reset 回 IDLE。RUNNING 中 Reset 立即回 IDLE (不写 CompletedSeq,
    **不清 jog 命令位** —— 这正是 A10 要清残留位的原因)。
    ⚠ **裁决记录 (2026-08-10)**: 仓库内 eit_ptlc/plc/feedlift.xml 是 2026-07-03 的旧快照,
    其派发器 CASE 表只收 [11,12,21,22,91] 且稳定确认 T#200MS; **现役工程已扩到
    [10,11,12,13,21,22,91] 且稳定确认统一为 T#300MS**。以本 spec (现役) 为准,
    plc_feedlift.yaml 声明的 10/13 属实, 无冲突。旧 xml 只可作历史参照。

constants:
  stable_confirm_ms: 300        # 光电稳定确认时长 (feedlift_TO 的 PT), 现役统一 300ms
  gate_timeout_s: 10            # 前置门等待超时 (step 5 的 feedlift_TO PT)
  init_homed_timeout_s: 5       # A10 校验双轴 bHomed 的超时
  recapture_max_mm: 2.0         # 单次抖动重捕获的最大位移 (超出即判失败)
  recapture_max_count: 2        # 重捕获次数上限 (RetryCount < 2)
  feed_lower_rel_mm: -5.0       # A12 相对下降量
  debug_stable_ms: 200          # A91 调试确认时长 (**刻意与 300ms 不同**)

actions:
  "10":
    name: A10_init_初始化
    pou: Application/50_action/FeedLift_L2/A10_init_初始化
    sha256: dd4701f44029c29c4d29297a4067c833742878989f90abbd6fa49f516942980e
    kind: instant
    summary: 清 L2 域内残留命令位, 再校验 1Z/2Z 已回零; 本动作不产生任何轴运动
    steps:
      - {step: 51, phase: clear_residual_commands}
      - {step: 52, phase: check_homed}
      - {step: 54, phase: fail}
    gate:
      homed: 玻璃上料轴1ZDATE.bHomed AND 玻璃上料轴2ZDATE.bHomed
    errors:
      308: 5 秒内双轴未同时 bHomed (只报错交上位机, **PLC 不自行 Home**)
    notes: |
      step 0 清六个残留位: Z1JOG_pos/Z1JOG_neg/Z2JOG_POS/Z2JOG_NEG +
      玻璃上料轴1ZDATE.xMoveRel + 玻璃上料轴2ZDATE.xMoveRel。
      清它们的原因 (ST 原注释): 搜索动作被 L2_Reset 中止时 jog 位停在 TRUE, 不清则
      下次上电即自行走轴; A12 的 xMoveRel 在 step0 置位、step10 才清, 中途 Reset 同样留 TRUE。
      步序变量由派发器 IDLE 统一清零, 此处不重复。
      308 的处置只能是人在 HMI 按【一键回原点】—— 上位机无回零通道。

  "11":
    name: A11_feed_raise
    pou: Application/50_action/FeedLift_L2/A11_feed_raise
    sha256: 91481d8cc528c04b4a1a3ad8a350d24c6eefca67acfe06656479fadfcefac923
    kind: jog_search
    summary: 1Z 向上搜索至 玻璃升降光电开关1 = TRUE (上料取料位), 停住后 300ms 稳定确认
    steps:
      - {step: 11, phase: preflight_and_search_up}
      - {step: 12, phase: confirm_stable}
      - {step: 13, phase: recapture_up}
      - {step: 14, phase: fail}
    gate:
      homed: 玻璃上料轴1ZDATE.bHomed
      proximity: 玻璃升降接近开关1 (仓底有板)
      feed_sensor: 上料进料传感器
      alarm: NOT Alarm.0
      timeout_error: 301
    errors:
      301: 前置门 10 秒未满足 (未回零 / 空仓 / 无料 / Alarm.0)
      303: 搜索区间非法 (SearchLowTarget >= SearchHighTarget)
      304: 向上搜到 SearchHighTarget 仍未见光电 TRUE
    notes: |
      内部步序 上料step: 0 (初始化, 校验区间) -> 5 (等前置门) -> 10 (向上 jog 搜 TRUE)
      -> 20 (停住确认 300ms) -> 30 (抖回 FALSE 时小幅向上重捕获, 最多 2 次且单次位移 < 2.0mm)。
      **启动时已 TRUE 直接进 20** (原地确认, 轴完全不动) —— 这正是真机"陈旧读数"坑的来源,
      沙盒必须保留该路径, 否则 bootstrap 的 z_clear 守卫失去被测机会。
      jog 位: 只用 Z1JOG_pos (向上); 每个分支入口都先把反向位清 FALSE。

  "12":
    name: A12_feed_lower
    pou: Application/50_action/FeedLift_L2/A12_feed_lower
    sha256: 71ce60a265c7dd6be2d8e5567a01c712b3e7532255b8cfe9027c89e6e22e2537
    kind: axis_seq
    summary: 机器人吸住玻璃后, 1Z 相对下降 5mm 让位
    steps: []
    errors: {}
    notes: |
      本动作**从不写 FeedLift_L2_Step** (看门狗静默)。
      step 0: fRelTarget := -5.0, xMoveRel := TRUE; step 10: 等 bReMoveDone -> 撤 xMoveRel, DONE。
      无前置门、无错误分支 —— 卡死只能靠上位机停滞看门狗。
      ⚠ 沙盒的板堆计数在此扣减 (feed −1), 判据是本动作 DONE 且吸盘为 ON:
      物理上板离堆的时刻就是"吸住后降轴让位", 不是记账那一刻 (账本扣减在脚本 DONE,
      发生在流程中段第二次 probe 之后)。

  "13":
    name: A13_feed_clear
    pou: Application/50_action/FeedLift_L2/A13_feed_clear
    sha256: d24d9f9bc42e4533b88a9ac2c11e8908423bb47768835f4e7047b46cd5e8a579
    kind: jog_search
    summary: 1Z 向下退到 玻璃升降光电开关1 = FALSE, 给随后的 feed_raise 让出"从 FALSE 侧逼近"的行程
    steps:
      - {step: 41, phase: preflight_and_search_down}
      - {step: 42, phase: confirm_stable}
      - {step: 43, phase: recapture_down}
      - {step: 44, phase: fail}
    gate:
      homed: 玻璃上料轴1ZDATE.bHomed
      proximity: 玻璃升降接近开关1 (仓底有板)
      alarm: NOT Alarm.0
      timeout_error: 301
    errors:
      301: 前置门 10 秒未满足
      303: 搜索区间非法 (SearchLowTarget >= SearchHighTarget)
      307: 向下搜到 SearchLowTarget 仍未见光电 FALSE, 或重捕获超限/超 2.0mm
    notes: |
      **与 A11 的三处关键差异** (行为层不得照抄 A11 了事):
        1. 前置门**刻意不查 上料进料传感器** —— ST 原注释: "本动作是向下退让给测量让位,
           不该被仓内有无料卡住 (空仓标定第一组正需要它能跑)";
        2. 失败码是 **307** 不是 304/305;
        3. 段号是 41/42/43/44 段 (A11 是 11/12/13/14)。
      内部步序 上料step 结构与 A11 镜像: 0 -> 5 -> 10 (向下搜 FALSE) -> 20 (确认) -> 30 (重捕获)。
      启动时已 FALSE 直接进 20 原地确认 (同 A11 的幂等直通)。
      jog 位只用 Z1JOG_neg (向下)。

  "21":
    name: A21_unload_ready
    pou: Application/50_action/FeedLift_L2/A21_unload_ready
    sha256: e39e027e81e3c0c76b4edb63a01889a809be057d8c2e742ec42fabd5f38f77b2
    kind: jog_search
    summary: 2Z 向上搜索至 玻璃升降光电开关2 = TRUE (废料接料位)
    steps:
      - {step: 21, phase: preflight_and_search_up}
      - {step: 22, phase: confirm_stable}
      - {step: 23, phase: recapture_up}
      - {step: 24, phase: fail}
    gate:
      homed: 玻璃上料轴2ZDATE.bHomed
      out_sensor: 下料出料传感器
      alarm: NOT Alarm.1
      timeout_error: 302
    errors:
      302: 前置门 10 秒未满足 (未回零 / 出料传感器无信号 / Alarm.1)
      303: 搜索区间非法
      305: 向上搜到 SearchHighTarget 仍未见光电 TRUE, 或重捕获超限
    notes: |
      门条件与 A11 不同: 查的是 **下料出料传感器** 与 **Alarm.1**, **不查接近开关2**。
      内部步序 下料step: 0 -> 5 -> 10 (Z2JOG_POS 向上搜) -> 20 (确认 300ms) -> 30 (重捕获)。
      沙盒的 waste 计数在本动作 DONE 时**置 armed 标志**, 真正 +1 在放板 (吸盘 ON->OFF 沿) 时。

  "22":
    name: A22_unload_bury
    pou: Application/50_action/FeedLift_L2/A22_unload_bury
    sha256: 5c65a0b692880a74c8b005c148af1403e05dc42b500de26c31f99f2dbb59953b
    kind: jog_search
    summary: 机器人放废板后, 2Z 向下埋料直到 玻璃升降光电开关2 = FALSE
    steps:
      - {step: 31, phase: preflight_and_search_down}
      - {step: 32, phase: confirm_stable}
      - {step: 33, phase: recapture_down}
      - {step: 34, phase: fail}
    gate:
      homed: 玻璃上料轴2ZDATE.bHomed
      proximity: 玻璃升降接近开关2
      alarm: NOT Alarm.1
      timeout_error: 302
    errors:
      302: 前置门 10 秒未满足
      303: 搜索区间非法
      305: 向下搜到 SearchLowTarget 仍未见光电 FALSE, 或重捕获超限/超 2.0mm
    notes: |
      门条件与 A21 不同: 查 **接近开关2** (不查出料传感器) —— 与 A11/A13 的关系同构。
      内部步序 下料step: 0 -> 5 -> 10 (Z2JOG_NEG 向下搜 FALSE) -> 20 (确认) -> 30 (重捕获,
      判据 BuryStartPos − fActPos >= 2.0 即失败)。
      ST 里另有一整段被注释掉的旧实现 (T#200MS 版), 漂移看门狗按整体哈希比对时勿混淆。

  "91":
    name: A91_endcheck
    pou: Application/50_action/FeedLift_L2/A91_endcheck
    sha256: bd6ba606697483db228810964ef07c1289f33dbb7f39145d7c552b4866fa9b74
    kind: instant
    summary: DEBUG 用 —— 不动轴, 只确认指定轴的光电稳定处于 FeedLift_DebugExpectedFinal
    steps:
      - {step: 91, phase: debug_confirm}
    gate:
      axis: FeedLift_DebugAxis ∈ {1, 2}
    errors:
      306: FeedLift_DebugAxis 非 1/2
    notes: |
      判据: feedlift_TO(IN := (光电开关N = FeedLift_DebugExpectedFinal), PT := **T#200MS**)
      —— 注意这里是 200ms, 与其余动作的 300ms 刻意不同, 不要统一。
      不在任何生产流程里被调用 (只有排障脚本用), 但 accepts 里有它, 沙盒需按码接受。
