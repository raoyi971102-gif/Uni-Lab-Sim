  "50":
    name: A50_Expand_liquid_discharge_排液
    pou: Application/40_Man/Develop_TankDrain/A50_Expand_liquid_discharge_排液
    sha256: 46ff4750efe47c0731180b5c31de14b3d9d54c3c50b87623afd10ed1d9841477
    kind: composite
    summary: 展缸排液四相 (50->55->56->98), mock 已实现 (plc_server.run_tank_drain_fsm)
    steps: []
    gate:
      tank_state_reject: [10, 90]        # 接受门拒绝 -> 501
      tank_state_idempotent: [98, 99]    # 幂等直通 DONE (SafeState=10)
      tank_state_start: [0, 40]          # FSM 新起排液 (置 Tank_Drain_Enable)
      tank_state_reattach: [50, 55, 56]  # 在途重挂, 置 Enable 无害 (恢复向导 reattach)
    errors:
      501: 接受门拒绝 (Tank_State 10/90 不可排液)
      502: 排液 FSM 错误态 (RUNNING 中 Tank_State=90, 由急停联锁置入)
    notes: |
      锚点仅供漂移看门狗; 行为不在此重述 (mock 见 plc_server.run_tank_drain_fsm).
      派发器侧: 接受时置 Tank_Drain_Enable[缸], RUNNING 每扫描把 Tank_State 镜像进 Develop_L2_Step;
      98/99 或 Tank_Drain_Done 即 DONE (SafeState=10); Reset 与终态退场都会清 Tank_Drain_Enable.
      接受门与 Develop_TankDrain FSM 启动条件 {0,40} 为同一契约, 改一处必改另一处 (ST 注释原话).
      父级包装 POU Application/40_Man/Develop_TankDrain (仅逐扫描调用 A50) 的 sha256 =
      99e2bbe574f1fe4adb9d6592716834ad7cf6543cb6029fff9bbddf3f06f38520, 一并作漂移锚点.
      四个时长经通道下发: Tank_Drain_S/Tank_Drain_Cap_S/Tank_Blow_S/Tank_Dry_S; 硬上限只锁存
      Tank_Drain_CapHit 继续吹扫不报错; 急停把在途缸 (50/55/56) 置 90 并关阀撤泵票.
  "51":
    name: release_tank_释放缸资源
    pou: Application/50_action/Develop_L2
    sha256: 373b4ae1673a5d5ffc5be30c1ec350ff287308250af3f977db9cb98d626e69e4
    kind: instant
    summary: 释放已排空缸资源 (Tank_State 归 0), 内联于派发器, 同一扫描完成
    steps: []
    gate:
      tank_state_allow: [98, 99, 0]      # 仅 DrainedIdle(98)/legacy Done(99)/Idle(0) 可释放, 否则 511
    errors:
      511: 缸态不可释放 (接受门与 RUNNING 复检同用此码)
    notes: |
      内联于派发器, 无独立 POU (sha256 同派发器).
      接受门: Tank_State ∈ {98, 99, 0} 才进 RUNNING (SafeState 接受时即写 10), 否则 511 REJECTED.
      RUNNING (scan-local): 先把 Tank_State 镜像进 Develop_L2_Step, 复检状态仍 ∈ {98, 99, 0} 则
      清 Tank_Drain_Enable[缸] 与 Tank_Drain_Done[缸], Tank_State[缸]:=0, bActionDone (同一扫描);
      复检失败 (接受与运行两扫描间被排液 FSM 改态) 则 ErrorCode 511, ERROR.
      不驱动泵/阀/气缸/缸盖; 机器人须已完全取板 (上位机契约, PLC 不校验).
      与 plc_develop.yaml desc 无冲突.
