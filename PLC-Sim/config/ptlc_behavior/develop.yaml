# Develop 工位 PLC 编排说明书: 从 CODESYS 现役工程逐字提取的内部工序记录.
# 供虚拟 PLC 行为层照抄与漂移看门狗校验; sha256 逐字来自导出快照 index.json.
# 行为事实一律以 ST 为准; 与 config/actions/02_develop/plc_develop.yaml desc 的出入在各动作 notes 点名.
schema: ptlc.plc_choreography/v1
station: Develop
codesys_project: 20260702.project
extracted_at: "2026-08-10"
dispatcher:
  pou: Application/50_action/Develop_L2
  sha256: 373b4ae1673a5d5ffc5be30c1ec350ff287308250af3f977db9cb98d626e69e4
  accepts: [10, 20, 21, 22, 26, 31, 32, 50, 51]
  unknown_code_error: 101
  gate_errors:
    190: 部署/就绪门拒绝 (Start 沿且 IDLE 时 NOT PLC_Ready 或 PLC_Deploy_State<>0, 先于一切检查, REJECTED)
    102: 目标缸号越界 (Expand_Target_Tank 不在 1..8, REJECTED)
  notes: |
    状态机: 0=IDLE, 10=RUNNING, 20=DONE, 30=REJECTED, 40=ERROR; 终态 CASE 还列了 50 但本 POU 从不赋值 (遗留).
    握手协议: 上位机写 Develop_L2_RequestSeq/ActionCode (及所需通道) 后拉高 Develop_L2_Start;
    接受时锁存 AcceptedSeq:=RequestSeq, ActiveCode:=ActionCode, ErrorCode:=0, Retryable:=FALSE;
    终态写 CompletedSeq:=AcceptedSeq; Start 落沿或 Reset 使终态回 IDLE (ActiveCode=50 时顺带清 Tank_Drain_Enable).
    检查优先级: 190 (RETURN, 不进 CASE) -> 102 -> 按码门 (501/511) -> 101 未知码.
    接受时复位: 初始化step/清洗STEP/润洗展缸STEP/上液step/放硅胶板step 全清零,
    并对 A26 判据域定时器 TON_2/TON[4]/TON[7]/TON[10] 以 IN:=FALSE 调用清零
    (TON 冻结语义: 上次动作中止后残留计时会让下次 A26 进场即误判 402 或空过判据, 此清零为防残留).
    缸号换算: DrainTank:=Expand_Target_Tank; Expand_Group:=(DrainTank-1)/4+1 (整除),
    Expand_Number:=(DrainTank-1) MOD 4 + 1; 即 1..4 -> 组1, 5..8 -> 组2.
    Reset 语义: RUNNING 中 Develop_L2_Reset 立即中止 (ActiveCode=50 先清 Tank_Drain_Enable) 回 IDLE,
    不写 CompletedSeq (被中止的动作永不完成, 由上位机自行了断); 终态中 Reset 与 Start 落沿等效退场.
    SafeState 语义: 常规接受写 0; code 50 幂等直通 (缸态 98/99) 与 50/51 完成时写 10 (缸已排空安全态).
    Develop_L2_Step: IDLE 恒写 0; 仅 code 50/51 在 RUNNING 每扫描镜像 Tank_State[DrainTank];
    其余动作全程不写 (L2 字段静默), 内部相位走派发器局部 step 变量.
    泵转发通道 (A10/20/21/22 共用): 转发转存 (STRING) 为指令载荷, 写 %MW1300:=LEN(转发转存) 触发串口转发,
    %MW1300=0 表示通道空闲可再发; 泵站位符 (BOOL) 为通道占用互斥旗, 发令置 TRUE, 泵空闲沿收到后清 FALSE;
    %MX2005.5 为"泵空闲中"状态位, 由最近一次 /1Q 或 /2Q 查询应答刷新 (两组泵共用同一位),
    各动作用 R_TRIG 只认它的上升沿, 即泵须先落忙再回空闲; 收尾冲刷约定见 constants.mw1300_flush_sentinel.
constants:
  a20_first_query_delay_s: 1        # TON[2] T#1S: 进入查询相位后首查延时 (Q 保持, 之后每扫描可重发查询)
  a20_settle_after_pump_s: 3        # TON_0 T#3S: 泵空闲沿后的收尾静置
  a21_first_query_delay_s: 0.1      # TON[1] T#0.1S: 每次循环进入查询相位后的首查延时
  a21_settle_after_pump_s: 5        # TON_1 T#5S: 末次泵空闲后的收尾静置
  a22_first_query_delay_s: 0.5      # TON[9] T#0.5S: 每次循环进入查询相位后的首查延时
  mw1300_flush_sentinel: 128        # 收尾冲刷: 转发转存:='' 且 %MW1300:=128 (逐字照抄的通道收尾约定)
  pump_init_cmd_group1: "/1Z0,2,2R$R"   # A10 组1 泵初始化指令 (字面量)
  pump_init_cmd_group2: "/2Z0,2,2R$R"   # A10 组2 泵初始化指令 (字面量)
  pump_query_cmd_group1: "/1Q$R"        # 组1 泵状态查询指令 (字面量)
  pump_query_cmd_group2: "/2Q$R"        # 组2 泵状态查询指令 (字面量)
actions:
  "10":
    name: A10_init_初始化
    pou: Application/50_action/Develop_L2/A10_init_初始化
    sha256: 6a557ea8cdc05cedecd061dca5594283cd811ab1d48659c3d72a9c3997cd33ce
    kind: composite
    summary: 清零所选缸全部阀/气缸输出并向组泵发 Z0,2,2R 初始化, 等泵空闲上升沿完成
    steps: []
    errors: {}
    notes: |
      本动作从不写 Develop_L2_Step; 内部相位走 初始化step: 0 -> 10 -> (完成回 0).
      step 0: 先清零流程标志 (润洗展缸STEP/清洗STEP/上液step/放硅胶板step 归零;
      expand_initialization_OK/Expand_Group_clean_OK/Expand_up_liquid_OK/Expand_silica_gel_plate_OK 清 FALSE),
      再按 Expand_Group/Expand_Number 把所选缸 8 个输出全清 FALSE:
      展缸G气缸N手动/自动, 展缸G进液电池阀N手动/自动, 展缸G排液电池阀N手动/自动, 展缸G吹气电池阀N手动/自动.
      随后待 %MW1300=0 且 泵站位符=FALSE 时发组泵初始化指令 (组1 '/1Z0,2,2R$R' / 组2 '/2Z0,2,2R$R'),
      置 泵站位符:=TRUE, 转 step 10.
      step 10: 只要 %MW1300=0 即重发查询 ('/1Q$R' 或 '/2Q$R', 无首查延时, 与 A20/21/22 不同);
      R_TRIG[组号].Q (%MX2005.5 泵空闲上升沿) 到来时 泵初始化完成:=TRUE, 泵站位符:=FALSE, bActionDone.
      细节: R_TRIG[1]/R_TRIG[2] 的 CLK 都是 %MX2005.5, 按组分立是残迹;
      expand_initialization_OK 只清不置 (遗留标志), 完成信号仅 bActionDone;
      不等待被清零阀/气缸的任何反馈; 无错误分支, 泵无响应由上位机超时兜底.
      与 plc_develop.yaml desc 无冲突.
  "20":
    name: A20_pipeline_清洗管路
    pou: Application/50_action/Develop_L2/A20_pipeline_清洗管路
    sha256: 322ebc739b03daaa49a1560f4441b4f288baa1a8e5835c1bfb7fba15971b9cd6
    kind: pump_seq
    summary: 单次转发上位机生成的泵指令串清洗管路, 泵空闲后静置 3s 置 Expand_Group_clean_OK
    steps: []
    errors: {}
    notes: |
      本动作从不写 Develop_L2_Step; 内部相位走 清洗STEP: 0 -> 10 -> 20 -> (完成回 0).
      step 0: 待 %MW1300=0 且 泵站位符=FALSE, 转发 Expand_forward_instructions (上位机生成, 只发一次,
      不按 rinse_repeat_count 循环), 置 泵站位符:=TRUE, 转 step 10.
      step 10: 进入 1s 后 (TON[2]) 开始查询, %MW1300=0 即重发 '/1Q$R'/'/2Q$R';
      R_TRIG[5].Q (泵空闲上升沿) 时 泵站位符:=FALSE, 转 step 20.
      step 20: TON_0 计 3s 到后冲刷通道 (转发转存:='', %MW1300:=128),
      置 Expand_Group_clean_OK:=TRUE, bActionDone.
      本动作不触碰任何阀/气缸输出, 不启真空, 流路由工艺编排另行保证; 无错误分支.
      与 plc_develop.yaml desc 无冲突.
  "21":
    name: A21_rinse_润洗展缸
    pou: Application/50_action/Develop_L2/A21_rinse_润洗展缸
    sha256: e049fdebc185d793a476833234d409f6c65ffd2f7792ff5bc0b2d8c4d18c4502
    kind: composite
    summary: 开进液/排液阀与气缸后按 Expand_rinse_count 循环转发泵指令注液, 末次泵空闲静置 5s, 阀位保持交接 A26
    steps: []
    errors: {}
    notes: |
      本动作从不写 Develop_L2_Step; 内部相位走 润洗展缸STEP: 0 -> 10 -> 15 (10/15 循环) -> 20 -> (完成回 0).
      step 0: 润洗计数:=0 (入场清零), 再把所选缸三个输出置 TRUE:
      展缸G进液电池阀N自动, 展缸G排液电池阀N自动, 展缸G气缸N自动; 转 step 10.
      step 10: 待 %MW1300=0 且 泵站位符=FALSE, 转发 Expand_forward_instructions (每圈重发同一指令串),
      置 泵站位符:=TRUE, 转 step 15.
      step 15: 进入 0.1s 后 (TON[1]) 开始查询 '/1Q$R'/'/2Q$R'; R_TRIG[3].Q (泵空闲上升沿) 时
      泵站位符:=FALSE, 润洗计数+1; 计数 >= Expand_rinse_count 则清零计数转 step 20, 否则回 step 10.
      step 20: TON_1 计 5s 到后冲刷通道 (转发转存:='', %MW1300:=128),
      置 Expand_Group_clean_OK:=TRUE, bActionDone; 进液/排液阀与气缸自动输出保持 TRUE 不关 (交接给 A26).
      死配置: 本 POU 每扫描还给 TON_2 (step=30, 3s)/TON[4] (step=40, 30s)/TON[10] (组废液传感器, 10s)
      配了 IN/PT, 但 CASE 无 30/40 分支且不消费 TON[10].Q, 为遗留死代码, 对行为无影响
      (这三只定时器的活用法在 A26, PT 改由 Tank_Suction_* 通道驱动).
      无错误分支; 不启大真空泵. 与 plc_develop.yaml desc 无冲突.
  "22":
    name: A22_up_liquid_上液
    pou: Application/50_action/Develop_L2/A22_up_liquid_上液
    sha256: fa5f110919b6f9e4f6b61e42602992951cec0605fe83995daa3513e0758ff266
    kind: composite
    summary: 开进液阀按 Expand_up_liquid_count 循环转发泵指令上液, 计数达标关进液阀置 Expand_up_liquid_OK
    steps: []
    errors: {}
    notes: |
      本动作从不写 Develop_L2_Step; 内部相位走 上液step: 0 -> 10 -> 20 (10/20 循环) -> (完成回 0).
      整体包在 IF Expand_Group>0 AND Expand_Number>0 守卫内 (派发器换算后恒成立, 防御性残留).
      step 0: 仅置 展缸G进液电池阀N自动:=TRUE (不动排液/吹气/气缸); 转 step 10.
      step 10: 待 %MW1300=0 且 泵站位符=FALSE, 转发 Expand_forward_instructions, 置 泵站位符:=TRUE, 转 step 20.
      step 20: 进入 0.5s 后 (TON[9]) 开始查询 '/1Q$R'/'/2Q$R'; R_TRIG[6].Q (泵空闲上升沿) 时
      泵站位符:=FALSE 并立即冲刷通道 (转发转存:='', %MW1300:=128; 与 A21 只在末段冲刷不同, 本动作每圈都冲),
      上液计数+1; 计数 >= Expand_up_liquid_count 则清零计数, 关 展缸G进液电池阀N自动:=FALSE,
      置 Expand_up_liquid_OK:=TRUE, bActionDone (与关阀同扫描); 否则回 step 10.
      ST 补充 (desc 未提及): 上液计数 不在入场清零, 只在达标时归零; 若上次 A22 被 Reset 中止,
      残留计数会让下次少循环 (派发器接受时也不清它), 行为层须照抄该状态残留.
      无错误分支; 无收尾静置定时. 与 plc_develop.yaml desc 无行为冲突.
  "26":
    name: A26_rinse_suction
    pou: Application/50_action/Develop_L2/A26_rinse_suction
    sha256: eec2931ab0b9e5cf8b6113e3da9d77864d6dc2577d33694ee48640e9558c1a53
    kind: valve_seq
    summary: 承接 A21 阀位的润洗抽吸四相, 沉降 -> 废液走空判据 -> 关进液开吹气 -> 吹扫到时关阀完成
    steps: []
    errors:
      402: 抽吸超时 (沉降期满后 cap_s 看门狗到期而废液走空判据始终未连续满足)
    notes: |
      本动作从不写 Develop_L2_Step (L2 字段静默); 内部相位复用 润洗展缸STEP (与 A21 共享, 派发器接受时清零):
      0 (沉降+等走空) -> 10 (吹扫) -> (完成回 0).
      四个时长全部经 OPC 通道下发 (不落 constants): Tank_Suction_Settle_S (沉降)/Tank_Suction_Empty_S (走空判据)/
      Tank_Suction_Blow_S (吹扫)/Tank_Suction_Cap_S (硬上限), LREAL 秒 *1000 转 TIME 每扫描活读入 PT;
      PLC 侧变量初值即原硬编码值 (3/10/30/120), 是通道写不进来时的唯一兜底.
      定时器绑定: TON_2 (IN:=step=0, PT=settle), TON[7] (IN:=step=0, PT=cap, 与沉降同起点并行计时),
      TON[10] (IN:=组废液传感器, PT=empty; 展缸1溶剂废液检测传感器/展缸2溶剂废液检测传感器 按组取,
      传感器 TRUE=废液管已走空, 断续来液即复位重计), TON[4] (IN:=step=10, PT=blow).
      step 0: 必须先 TON_2.Q (沉降期满) 才评估判据; 判据优先于看门狗:
      TON[10].Q 则 关 展缸G进液电池阀N自动:=FALSE, 开 展缸G吹气电池阀N自动:=TRUE, 转 step 10;
      否则 TON[7].Q 则 Develop_L2_ErrorCode:=402, bActionError (step 归 0).
      ST 补充 (desc 未提及): 402 检查嵌在沉降判据之内, 报错最早时刻 = max(settle_s, cap_s), 非裸 cap_s;
      settle >= cap 的配置下看门狗被沉降钳制.
      step 10: TON[4].Q (吹扫到时) 后 关 展缸G排液电池阀N自动:=FALSE 与 展缸G吹气电池阀N自动:=FALSE,
      置 Expand_Group_clean_OK:=TRUE, bActionDone.
      前置 (上位机契约, PLC 不校验): 真空由 Pump_L2 vacuum_on 提供 (派发 code 26 前开, 正常/异常路径都须关);
      阀位承接 A21 (进液/排液阀开); 展缸G气缸N自动 本动作全程不触碰, 保持 TRUE 直到 code 31.
      派发器接受时清零 TON_2/TON[4]/TON[7]/TON[10] 防上次中止的残留计时 (见 dispatcher.notes).
      上位机 stall_timeout 须严格大于 cap_s, 否则 402 被竞态糊成结果不明确 (ST 注释原话).
  "31":
