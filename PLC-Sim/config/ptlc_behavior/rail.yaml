schema: ptlc.plc_choreography/v1
station: Rail
codesys_project: 20260702.project
extracted_at: "2026-08-10"

dispatcher:
  pou: Application/50_action/Rail_L2
  sha256: ecc71053ddfb8c8210723046fc3a2069463a9cd9f9d363a8eed1d6ab6798f299
  accepts: [10]
  unknown_code_error: 101
  gate_errors:
    190: 全局部署门 (NOT PLC_Ready 或 PLC_Deploy_State<>0), 在任何物理动作派发前拒绝
  notes: |
    标准 CASE State OF 派发器。code 10 的全部逻辑**内联在 IDLE 受理段**, 无独立动作 POU:
    受理那一刻就解析目标并下发 xMoveAbs, RUNNING 段只等 bAbMoveDone。
    RUNNING 中 Reset: 先撤 xMoveAbs 再回 IDLE (不写 CompletedSeq)。
    Rail_L2_Step 只在 IDLE 被写 0, 运行期不写 —— 看门狗静默。
    ST 里保留了一整段被注释掉的旧实现 (读 HMI_地轨轴11Y.position[]), 现役已换成
    PC 真源数组, 漂移看门狗按整体哈希比对时注意别把注释块当有效逻辑读。

constants:
  target_slot_min: 1           # Rail_Target_Position 合法区间 [1, 6]
  target_slot_max: 6
  target_mm_min_exclusive: 0.0    # fTgt <= 0.0 判非法 (PC 未 push / 重启归零)
  target_mm_max: 3000.0           # fTgt > 3000.0 判越限

actions:
  "10":
    name: A10_rail_move (内联于派发器)
    pou: Application/50_action/Rail_L2
    sha256: ecc71053ddfb8c8210723046fc3a2069463a9cd9f9d363a8eed1d6ab6798f299
    kind: axis_seq
    summary: 按位置码把地轨 11Y 移到 Rail_Pos_Target[Rail_Target_Position] (PC 真源坐标)
    steps: []
    gate:
      position_code_range: Rail_Target_Position ∈ [1, 6]
      target_sane: 0.0 < Rail_Pos_Target[n] <= 3000.0
    errors:
      101: 未知动作码 或 位置码越界 (retryable)
      102: 目标未初始化或越限 (fTgt <= 0 或 > 3000, retryable)
    notes: |
      **行为已在 mock 实现** (mock/behavior/motion.py::make_rail_motion + sim_stack 的
      rail_on_done_factory), 本条只补齐锚点与受理门, 供漂移看门狗与一致性测试使用。
      受理段时序 (照抄用):
        1. 校验 ActionCode=10 且 1 <= Rail_Target_Position <= 6, 否则 101 -> REJECTED;
        2. fTgt := Rail_Pos_Target[Rail_Target_Position];
        3. fTgt <= 0.0 或 > 3000.0 -> **102 REJECTED** (原文注释: "PC 未 push / 重启后
           Rail_Pos_Target 归 0 / 越限 -> 拒绝, 绝不移到 0 端" —— 这是防撞底兜底,
           沙盒必须保留可达性, 否则测不出"忘了 push 坐标"这类现场故障);
        4. 合法: SafeState:=0, 地轨轴11YDATE.fAbsTarget := fTgt, xMoveAbs := TRUE, State:=10。
      RUNNING: 只等 地轨轴11YDATE.bAbMoveDone, 到位后撤 xMoveAbs 并 DONE。
      ⚠ 无伺服报警分支 (ST 里只有一行注释占位), 故地轨卡死在沙盒与真机一样都只能靠
      上位机停滞看门狗判 —— 不要在行为层自造错误码。
