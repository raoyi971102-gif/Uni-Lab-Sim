# SZLab Poly Studio 握手仿真配置

# 默认使用设备包模式：一次启动常驻 Robot 与 S04-S09 全部协议。
# workflow 仅作为旧命令兼容的初始场景标签，不再决定启用哪些协议处理器。
mode: package
time_scale: 1.0

# 设备包中 S1 连续流工作站使用 HTTP，不走 OPC UA。package mode 会在同一
# 进程内启动隔离 stand-in；Edge 图中的 S1 host/port 应指向这里。
s1_http:
  enabled: true
  host: 127.0.0.1
  port: 8055

# 默认动作延时。可按协议模块覆盖：robot、stirrer、pump、s07、s08、s09。
# S04 接单后优先读取驱动写入的「磁搅时间设置_上位机[n]」（毫秒）；
# 只有节点缺失或值无法解析时才回退到 stirrer/delay_ms。
delay_ms: 500
poll_ms: 20

# 与 Uni-Lab-SZLab 工作流目录对齐的兼容场景选项。
# workflow 可设为 all 或任一 WORKFLOW_ID；设备包模式始终轮询全部设备协议。
# position 仅指定默认 S04 物料/调试位置（1-6），六个 S04 周期都会常驻。
# pump=3 表示 1、2 号储液瓶均初始化为在位。
workflow: all
position: 1
pump: 1
s06_robot_workflow: false
s09_pipetting_workflow: false
s09_remaining_volume_ml: 100.0
s07_balance_reading: 1.0
s09_balance_reading: 1.0

# 正常停止代理时，只清理代理拥有的 PLC 输出；不会覆盖任务号、工艺选择等 PC 输入。
cleanup_on_exit: true

delays:
  robot: 500
  stirrer: 500
  pump: 500
  s07: 500
  s08: 500
  s09: 500

# 可在这里覆盖或补充 PLC -> 上位机的仿真初值，例如：
# initial_values:
#   S09天平读数: 12.34
# 默认点表：data/szlab_plc_0810.csv
# S09天平读数稳定已从 0810 移除；工艺完成只看 S09工艺完成，
# 工艺 9 完成后按测密度次数写抽/放液天平数组。
initial_values: {}
