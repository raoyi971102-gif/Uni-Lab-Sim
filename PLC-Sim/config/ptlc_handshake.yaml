# PTLC V2 L2 握手仿真配置（PLC-Sim 自包含，不依赖 PTLC 运行时）
gvl_path:
  - DeviceSet
  - Inovance-ARM-Linux
  - Resources
  - Application
  - GlobalVars
  - Host_Computer

stations: [Sampling, Collect, Develop, PhotoScrape, FeedLift, Pump, Rail, StagingA]
delay_ms: 200
poll_ms: 20
time_scale: 1.0
deploy_prepare_ms: 40

# 八工位合法动作码、步序和错误码的自包含快照。未知动作一律 101 REJECTED。
behavior_dir: config/ptlc_behavior

# 模拟一台已经完成启动、总线正常的 PLC。
initial_values:
  PLC_Startup_State: 60
  PLC_Startup_ErrorCode: 0
  PLC_Ready: true
  PLC_Axis_CommOperational: [true, true, true, true, true, true, true, true, true, true, true]
  Pump_Vacuum_On: false
  Tank_Drain_S: 0.20
  Tank_Drain_Cap_S: 0.50
  Tank_Blow_S: 0.10
  Tank_Dry_S: 0.05
  Tank_Suction_Settle_S: 0.20
  Tank_Suction_Empty_S: 0.20
  Tank_Suction_Blow_S: 0.20
  Tank_Suction_Cap_S: 1.00
  Expand_Waste_Empty_G1: true
  Expand_Waste_Empty_G2: true
  FeedLift_1Z_SearchLowTarget: 0.0
  FeedLift_1Z_SearchHighTarget: 600.0
  FeedLift_2Z_SearchLowTarget: 0.0
  FeedLift_2Z_SearchHighTarget: 600.0
  Rail_Homed: true

# 轴运动按动作码构造，按距离/速度连续推进 ActPos。
motion_speed:
  Sampling: 250.0
  PhotoScrape: 180.0

process:
  material: {feed_count: 12, waste_count: 0, capacity: 30}

# 默认 standalone 适合一键调试 PLC：收瓶等外部取放会自动补位。接入 Uni-Lab
# OS 与机器人模拟器时改为 federated，并通过 --world-file 写入幂等 events。
# 两种模式都只维护 PLC 可观察事实，不在此触发工作流或直连设备动作。
plant:
  synthesize_inputs: true
  sensor_mode: standalone
  external_transition_s: 0.50
  phase_s: 0.05
  cylinder_s: 0.20
  cnc_s: 2.0
  jog_speed_mm_s: 15.0
  feed_homed: true
  waste_homed: true
  feedlift_calibration:
    feed: {z_empty_mm: 500.0, pitch_mm: 2.5}
    waste: {z_empty_mm: 500.0, pitch_mm: 2.5}
  nominal_positions:
    sampling_place_7y: 0.0
    sampling_spray_7y: 0.0

# 正常完成后的通用副作用。轴运动必须按动作码声明，禁止整站镜像。
station_effects:
  Rail:
    copy:
      - {from: Rail_Target_Position, to: Rail_Current_Position}
    indexed_copy:
      - {from: Rail_Pos_Target, index: Rail_Target_Position, index_base: 1, to: Rail_ActPos}

# 展缸排液/释放的最小物理副作用，足以让上层工作流验证数组读写和状态推进。
action_effects:
  Develop:
    "50":
      set_index:
        - {node: Tank_State, index: Expand_Target_Tank, index_base: 1, value: 98}
        - {node: Tank_Drain_Done, index: Expand_Target_Tank, index_base: 1, value: true}
    "51":
      set_index:
        - {node: Tank_State, index: Expand_Target_Tank, index_base: 1, value: 0}
        - {node: Tank_Drain_Enable, index: Expand_Target_Tank, index_base: 1, value: false}
        - {node: Tank_Drain_Done, index: Expand_Target_Tank, index_base: 1, value: false}

# 故障注入示例（默认空）；可按工位填写动作码。
faults:
  all: {reject_codes: [], error_codes: [], hang_codes: []}
