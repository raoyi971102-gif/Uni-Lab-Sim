# Generated PTLC V2 protocol snapshot; do not edit by hand.
# Refresh with tools/snapshot_ptlc_profile.py.
# PLC OPC UA 节点表
# ==================
# 事实源: PLC 工程导出的符号配置 (plc/*.Device.Application.xml 的 Host_Computer 段).
#   ⚠ 本表最初由 UI-Upper/core/plc_client.py 的 NODE_TYPES 照抄而来, 那张表对应更早的 PLC
#     世代, 曾遗留 11 个真机根本不存在的名字 (启动时刷 WARNING)。已于 2026-07-28 对账清理。
# 校验: 经 eit_ptlc.config.loader.load_plc_nodes 加载, 类型名须属 VALID_NODE_TYPES;
#       tests/test_plc_nodes_vs_symbol_xml_offline.py 拿符号 XML 对账本表, 再漂移即测试红.
# 说明: 本表为 PLC 当前已暴露的 Host_Computer 节点 (含 Sampling_L2_* 试点通道).
#       全工位统一 L2 通道 (Collect_L2_* / Expand_L2_* / PhotoScrape_L2_*) 在 P4 扩展.
#       optional: true 表示"已知 PLC 端暂无"(待建 / 仅 Mock 用) —— 缺失只记 INFO 不告警,
#       是上述对账测试唯一的豁免口, 加之前先确认真是待建而非写错名.
#
# OPC UA 路径: 从 Objects 起逐级按 BrowseName 文本匹配 (跨命名空间) 到全局变量容器.
#   实机 (Inovance/CODESYS): Objects/DeviceSet/Inovance-ARM-Linux/Resources/Application/GlobalVars/Host_Computer/<var>
gvl_path:
  - DeviceSet
  - Inovance-ARM-Linux
  - Resources
  - Application
  - GlobalVars
  - Host_Computer

heartbeat_node: collect_Step   # 心跳读取节点 (覆盖工位级节点)
estop_node: PLC_EStop          # 急停节点 (上升沿触发 on_estop)

nodes:
  # ── 调试辅助 ──
  # 真机 Host_Computer 无此变量; 保留声明只为让 mock/plc_server.py 建出它,
  # 供 test_opcua_driver_offline.py 做布尔读写往返。故标 optional.
  Test_BOOL: {type: Boolean, optional: true, comment: "仅 Mock 调试位, 真机不存在"}

  # ── PLC 全下载安全握手 / 下载后启动诊断 ──
  # PC/HMI 先请求 PLC 受控停轴并撤销伺服使能；State=20 仅表示可提交，Host 写匹配
  # CommitSeq 并确认 State=25 后才允许 worker 登录并完整下载。
  PLC_Deploy_RequestSeq: {type: Int32, comment: "PC/HMI 写：下载准备请求序号"}
  PLC_Deploy_CommitSeq: {type: Int32, comment: "仅上位机写：确认同一请求进入不可取消的25=COMMITTED阶段；0用于明确未下载后的人工/Host解锁"}
  PLC_Deploy_Start: {type: Boolean, comment: "PC/HMI 写：上升沿请求进入下载安全态"}
  PLC_Deploy_Reset: {type: Boolean, comment: "PC/HMI 写：取消/复位下载准备状态"}
  PLC_Deploy_State: {type: Int16, comment: "PLC 写：0=IDLE,10=PREPARING,20=SAFE_TO_DOWNLOAD,25=HOST_COMMITTED,30=BUSY_REJECTED,40=ERROR"}
  PLC_Deploy_AcceptedSeq: {type: Int32, comment: "PLC 写：已接受的下载准备请求序号"}
  PLC_Deploy_ErrorCode: {type: Int16, comment: "PLC 写：1=L2忙,2=轴忙,3=辅助执行器输出或待执行命令,5=通信,40=断使能超时,41/42=安全不变量丢失"}
  PLC_Startup_State: {type: Int16, comment: "PLC 写：0=BOOT,10=WAIT_BUS,20=RESET,30=POWER,40/41=HOME_5Z,50/51=HOME_4X,60=READY,90=ERROR"}
  PLC_Startup_ErrorCode: {type: Int16, comment: "PLC 写：启动状态机首个根因码"}
  PLC_Ready: {type: Boolean, comment: "PLC 写：总线、轴使能及增量轴回零均完成"}
  PLC_Startup_AlarmInhibit: {type: Boolean, comment: "PLC 写：启动/下载瞬态报警历史抑制；HMI逐轴报警条件必须与其取反后相与"}
  PLC_HandWheel_Active: {type: Boolean, comment: "PLC 写：至少一个手轮从轴仍在啮合或正在啮合/脱开"}
  PLC_Axis_CommOperational: {type: Boolean, array_len: 11, comment: "PLC 写：轴1..11 EtherCAT/SoftMotion 通信可运行"}
  PLC_Axis_FaultSource: {type: Int16, array_len: 11, comment: "PLC 写：轴1..11首个故障来源枚举"}
  PLC_Axis_FaultCode: {type: Int32, array_len: 11, comment: "PLC 写：轴1..11首个原始故障码（不做位或）"}

  # ── collect 收集工位 (六件套 + 业务参数) ──
  collect_Enable: {type: Boolean}
  collect_Step: {type: Int16}
  collect_Done: {type: Boolean}
  collect_Error: {type: Boolean}
  collect_Reset: {type: Boolean}
  collect_Busy: {type: Boolean}
  collect_forward_instructions: {type: String, comment: "注射泵转发指令"}
  collect_count: {type: Int16}

  # ── Expand 展开工位 (PLC 前缀 Expand; 上位机 stage 名 develop) ──
  Expand_Enable: {type: Boolean}
  Expand_Step: {type: Int16}
  Expand_Done: {type: Boolean}
  Expand_Error: {type: Boolean}
  Expand_Reset: {type: Boolean}
  Expand_Busy: {type: Boolean}
  Expand_Mode_Flag: {type: Int16, comment: "0=润洗缸 / 1=清洗管路"}
  Expand_Group: {type: Int16, comment: "展开组号 (PLC 从 Target_Tank 推导)"}
  Expand_Number: {type: Int16, comment: "展缸号 (PLC 从 Target_Tank 推导)"}
  Expand_forward_instructions: {type: String, comment: "注射泵转发指令"}
  Expand_Target_Tank: {type: Int16, comment: "目标缸号 1-8, PC 写入"}
  Expand_rinse_count: {type: Int16, comment: "润洗注射泵重复次数 (Step 10)"}
  Expand_up_liquid_count: {type: Int16, comment: "上液注射泵重复次数 (Step 20)"}
  # 402 复盘可观测性镜像 (PLC_Pump_泵管理 每扫描镜像; 只读诊断)
  Expand_Waste_Empty_G1: {type: Boolean, comment: "PLC 写: 镜像 IO.展缸1溶剂废液检测传感器 (%IX4.1); TRUE=组1(缸1-4)废液管已走空"}
  Expand_Waste_Empty_G2: {type: Boolean, comment: "PLC 写: 镜像 IO.展缸2溶剂废液检测传感器 (%IX6.1); TRUE=组2(缸5-8)废液管已走空"}

  # ── 多通道展开: 展缸状态跟踪 (真数组) ──
  Tank_State: {type: Int16, array_len: 8, comment: "0=Idle,10=Prepping,40=Developing(legacy),50=Draining,55=BlowAir,56=Drying,98=DrainedIdle(盖关待取板),99=legacy遗留,90=Error"}
  Tank_SampleID: {type: Int32, array_len: 8, comment: "绑定样品ID (调试)"}
  Tank_Drain_Enable: {type: Boolean, array_len: 8, comment: "PC 触发排液"}
  Tank_Drain_Done: {type: Boolean, array_len: 8, comment: "PLC 排液完成"}
  Tank_Drain_CapHit: {type: Boolean, array_len: 8, comment: "PLC 锁存: Phase A 走硬上限强制进吹扫 (上机复盘直读; 下次排液启动清)"}
  # ⚠ 以下 4 个时长为共享标量: 当前 code 50 阻塞占 Develop_L2 单通道、排液串行, 安全;
  #   §8 trigger/wait 拆分(多缸并发排液)前须升级为每缸数组或 PLC 启动时锁存, 否则后派发会改写在途缸的 PT
  Tank_Drain_S: {type: Double, comment: "排液 Phase A 判据时长 s (组废液线持续走空满此值)"}
  Tank_Drain_Cap_S: {type: Double, comment: "排液 Phase A 每缸硬上限 s (同组并发被邻缸挟持时兜底)"}
  Tank_Blow_S: {type: Double, comment: "排液 Phase B 吹扫时长 s (真空票保持)"}
  Tank_Dry_S: {type: Double, comment: "排液 Phase B' 原位干燥时长 s (0=跳过; 对应 run 级 knob dry_duration_s)"}
  # ── 润洗抽吸 (A26) 时长参数: 上位机派发 code 26 前经 develop.rinse_suction 的 channel 直透写入 ──
  # 与排液不同, A26 全程阻塞占 Develop_L2 单通道, 不存在并发实例改写在途 PT 的问题。
  # PLC 侧同名变量带初值 (3/10/30/120) 且与动作 YAML default 一致, 是通道写不进来时的唯一兜底。
  Tank_Suction_Settle_S: {type: Double, comment: "润洗抽吸 step0 入场沉降 s"}
  Tank_Suction_Empty_S: {type: Double, comment: "润洗抽吸 废液传感器持续走空判据 s (瞬断即清零重计)"}
  Tank_Suction_Blow_S: {type: Double, comment: "润洗抽吸 step10 吹气时长 s"}
  Tank_Suction_Cap_S: {type: Double, comment: "润洗抽吸 超时看门狗 s (触发 ErrorCode 402); 动作 stall_timeout 须严格 > 本值"}

  # ── Sampling 上样点样工位 (六件套 + 业务参数) ──
  Sampling_Enable: {type: Boolean}
  Sampling_Step: {type: Int16}
  Sampling_Done: {type: Boolean}
  Sampling_Error: {type: Boolean}
  Sampling_Reset: {type: Boolean}
  Sampling_Busy: {type: Boolean}
  Sampling_clean_instructions: {type: String, array_len: 2, comment: "清洗 mode=0:[内壁,外壁]×count / mode=1:[吸+充上样流路+冲外壁链式, 冲点样头A0] (Step 10)"}
  Sampling_clean_count: {type: Int16}
  Sampling_clean_mode: {type: Int16, comment: "清洗模式: 0=重清洗(现行) 1=轻清洗充液(PLC在entry边界Q空闲后切三通→点样, 结束复位→上样)"}
  Sampling_prep_instructions: {type: String, array_len: 2, comment: "上样准备 [保留驱动清洗液, 空占位] (A40)"}
  Sampling_X_coordinate: {type: Int16}
  Sampling_Y_coordinate: {type: Int16}
  Sampling_sample_instructions: {type: String, array_len: 2, comment: "上样 [P相对回抽样品, 绝对吸气隔断A{gap}] (A50 按 [2]->[1] 消费; [2] 空串则跳过吸气段)"}
  Sampling_rinse_mix_instructions: {type: String, array_len: 4, comment: "点样后润洗吹打 [回打当前余量A0, 口1吸润洗液后口3打回A0, 抬针后口3吸气隔断至A{gap}, 口3吹打一次A{gap+mix}回A{gap}] (A55)"}
  Sampling_rinse_mix_count: {type: Int16, comment: "点样后润洗吹打次数 (A55, 1..20)"}
  Sampling_dispense_instructions: {type: String, array_len: 2, comment: "点样 [抽取空气, 打气点样] (Step 50)"}
  Sampling_band_run_instruction: {type: String, comment: "单条带点样: 每程有限 A0R；轴到位后 PLC 发 T 并以 ? 查询真活塞位"}
  Sampling_band_stop_instruction: {type: String, comment: "单条带点样: 兼容保留的立即停止指令 (DT T); 正常路径不使用"}
  Sampling_band_spot_speed: {type: Double, comment: "单条带点样 6X 液体扫线速度(mm/s)"}
  Sampling_band_dry_speed: {type: Double, comment: "单条带点样 6X 只吹气扫线速度(mm/s)"}
  Sampling_band_dry_cycles: {type: Int16, comment: "单条带点样 连续吹气往复周期数; 气保持 ON"}
  Sampling_band_end_position: {type: Int16, comment: "单条带点样: 活塞终点目标步数(死体积补偿); 0=打到底(旧行为); 判终 pos<=N+5"}

  # ── Sampling L2 原子动作通道 (解耦后 PLC 仅 L2; ControlMode 已退役) ──
  Sampling_L2_ActionCode: {type: Int16}
  Sampling_L2_RequestSeq: {type: Int32}
  Sampling_L2_Start: {type: Boolean}
  Sampling_L2_Reset: {type: Boolean}
  Sampling_L2_State: {type: Int16, comment: "0=IDLE,10=RUNNING,20=DONE,30=REJECTED,40=ERROR,50=INTERRUPTED"}
  Sampling_L2_ActiveCode: {type: Int16}
  Sampling_L2_AcceptedSeq: {type: Int32}
  Sampling_L2_CompletedSeq: {type: Int32}
  Sampling_L2_Step: {type: Int16}
  Sampling_L2_ErrorCode: {type: Int16}
  Sampling_L2_SafeState: {type: Int16}
  Sampling_L2_Retryable: {type: Boolean}

  # ── scrape 拍照刮板工位 (六件套 + 业务参数) ──
  scrape_Enable: {type: Boolean}
  scrape_Step: {type: Int16}
  scrape_Done: {type: Boolean}
  scrape_Error: {type: Boolean}
  scrape_Reset: {type: Boolean}
  scrape_Busy: {type: Boolean}
  scrape_Confirm: {type: Boolean, comment: "乒乓确认信号"}
  scrape_WaitConfirm: {type: Boolean, comment: "PLC 侧显式就绪信号"}
  scrape_gcode_instructions: {type: String, comment: "G-code 指令 (CNC 接入后兼容写空)"}
  scrape_PhotoMode: {type: Int16, comment: "0=完整刮板,1=仅before-photo,2=重刮"}
  scrape_IsLast: {type: Boolean, comment: "本次为该样品最后一次刮取"}
  # scrape_Source_Tank: 旧上位机的诊断单向变量, PLC 侧从未建, 上位机也从未写 —— 已删除.

  # ── CNC 主方案: ScrapeCNC 点位数组 + 标量参数 ──
  # 真机契约就是这 6 个: 块写 g_sx/g_sy/g_cx/g_cy/g_scrape_feed, 再逐 pass 写 g_pass_z.
  # safe_z / approach_z / plunge_feed 真机已删除, 上位机不再产出 (见 controller/cnc_path.py 头注释);
  # total_depth / plate_surface_z 也无须下发 —— 上位机本地算 pass_z = plate_surface + k*total_depth/N
  # 后只把结果写 g_pass_z, PLC 不再内部计算。五者均已从本表删除。
  g_sx: {type: Float, array_len: 400}
  g_sy: {type: Float, array_len: 400}
  g_cx: {type: Float, array_len: 400}
  g_cy: {type: Float, array_len: 400}
  g_pass_z: {type: Float, comment: "当前 pass 深度 mm"}
  g_pass_count: {type: Int16, comment: "pass 次数 (0=占位/跳过)"}
  g_scrape_feed: {type: Int16, comment: "刮扫进给 mm/min"}

  # ── 耗材管理 (PC→PLC 决策参数 + PLC→PC 传感器) ──
  # scrape_Plate_Op / collect_Plate_Op (0=NONE/1=PUT_NEW/2=SWAP) 是旧世代"PLC 自己决策换板"
  # 留下的字段, PLC 侧从未建。现决策全在 PC: runtime/material_store.plan_staging 出方案,
  # bootstrap._material_plan_staging 拿中转在位传感器核对后, 只下发下面这些槽位参数。
  scrape_Fetch_Rack_Plate: {type: Int16, comment: "0=不搬, 1-12=从架搬板到中转A"}
  scrape_Old_Plate_Slot: {type: Int16}
  scrape_Consume_Slot: {type: Int16, comment: "1-6=从中转A取该孔"}
  collect_Fetch_Rack_Plate: {type: Int16, comment: "0=不搬, 1-12=从架搬板到中转B"}
  collect_Old_Plate_Slot: {type: Int16}
  collect_Consume_Slot: {type: Int16, comment: "1-6=从中转B取该孔"}
  collect_Powder_Return_Slot: {type: Int16, comment: "粉末收集器归还中转A原始孔 (1-6)"}
  # 输入映像字节 (物料在位对账真源; 按位寻址见 config/material_topology.yaml)
  # ⚠ 这些字节是共享的, 取位必须掩掉不属于本用途的位:
  #   IX8  bit2=收集平台暂存工位传感器(中转B), bit3/4=玻璃升降光电开关1/2, bit5/6=玻璃升降接近开关1/2
  #   IX9  bit0/1=上样料架检测1/2 (上料两处托盘位),
  #        **bit6=刮板拍照旋转气缸原点(%IX9.6), bit7=同缸动点(%IX9.7)** —— 翻料到位反馈,
  #        由 photoscrape.wait_rot 按位取 (A41/A52 都是开环, 这是上位机唯一的到位知情渠道)
  #   IX10 bit0=刮板拍照下压气缸上位, bit2=刮板拍照暂存工位传感器(中转A)
  #   IX12 bit0-3=料库检测9..12, **bit4-6=机器人工具检测1/2/3** (故料库只能取低 4 位)
  IX8:  {type: Byte, comment: "输入字节8: bit2=收集平台暂存工位(中转B), bit5/6=玻璃升降接近开关1/2"}
  IX9:  {type: Byte, comment: "输入字节9: bit0/1=上样料架检测1/2 (上料托盘位); bit6/7=刮板拍照旋转气缸原点/动点"}
  IX10: {type: Byte, comment: "输入字节10: bit2=刮板拍照暂存工位(中转A)"}
  IX11: {type: Byte, comment: "料库检测 1..8 位打包"}
  IX12: {type: Byte, comment: "料库检测 9..12 位打包 (低4位; bit4-6 是机器人工具检测)"}

  # ── 统一 L2 通道扩展 (P4): Collect / Develop / PhotoScrape 全工位 ──
  # 每工位 12 字段; 动作码与具名参数见 config/actions/plc_*.yaml
  Collect_L2_ActionCode: {type: Int16}
  Collect_L2_RequestSeq: {type: Int32}
  Collect_L2_Start: {type: Boolean}
  Collect_L2_Reset: {type: Boolean}
  Collect_L2_State: {type: Int16, comment: "0=IDLE,10=RUNNING,20=DONE,30=REJECTED,40=ERROR,50=INTERRUPTED"}
  Collect_L2_ActiveCode: {type: Int16}
  Collect_L2_AcceptedSeq: {type: Int32}
  Collect_L2_CompletedSeq: {type: Int32}
  Collect_L2_Step: {type: Int16}
  Collect_L2_ErrorCode: {type: Int16}
  Collect_L2_SafeState: {type: Int16}
  Collect_L2_Retryable: {type: Boolean}
  Collect_BottleLocate_Target: {type: Boolean, comment: "收集瓶定位气缸目标态, TRUE=定位, FALSE=松开"}

  StagingA_L2_ActionCode: {type: Int16}
  StagingA_L2_RequestSeq: {type: Int32}
  StagingA_L2_Start: {type: Boolean}
  StagingA_L2_Reset: {type: Boolean}
  StagingA_L2_State: {type: Int16, comment: "0=IDLE,10=RUNNING,20=DONE,30=REJECTED,40=ERROR,50=INTERRUPTED"}
  StagingA_L2_ActiveCode: {type: Int16}
  StagingA_L2_AcceptedSeq: {type: Int32}
  StagingA_L2_CompletedSeq: {type: Int32}
  StagingA_L2_Step: {type: Int16}
  StagingA_L2_ErrorCode: {type: Int16}
  StagingA_L2_SafeState: {type: Int16}
  StagingA_L2_Retryable: {type: Boolean}
  StagingA_LocatorA_Target: {type: Boolean, comment: "中转A定位气缸目标态, TRUE=动点, FALSE=原点"}
  StagingA_LocatorB_Target: {type: Boolean, comment: "中转B定位气缸目标态, TRUE=动点, FALSE=原点"}

  Develop_L2_ActionCode: {type: Int16}
  Develop_L2_RequestSeq: {type: Int32}
  Develop_L2_Start: {type: Boolean}
  Develop_L2_Reset: {type: Boolean}
  Develop_L2_State: {type: Int16, comment: "共享 prep 通道; 多缸并行用 Tank_State/Tank_Drain 数组"}
  Develop_L2_ActiveCode: {type: Int16}
  Develop_L2_AcceptedSeq: {type: Int32}
  Develop_L2_CompletedSeq: {type: Int32}
  Develop_L2_Step: {type: Int16}
  Develop_L2_ErrorCode: {type: Int16}
  Develop_L2_SafeState: {type: Int16}
  Develop_L2_Retryable: {type: Boolean}

  PhotoScrape_L2_ActionCode: {type: Int16}
  PhotoScrape_L2_RequestSeq: {type: Int32}
  PhotoScrape_L2_Start: {type: Boolean}
  PhotoScrape_L2_Reset: {type: Boolean}
  PhotoScrape_L2_State: {type: Int16}
  PhotoScrape_L2_ActiveCode: {type: Int16}
  PhotoScrape_L2_AcceptedSeq: {type: Int32}
  PhotoScrape_L2_CompletedSeq: {type: Int32}
  PhotoScrape_L2_Step: {type: Int16}
  PhotoScrape_L2_ErrorCode: {type: Int16}
  PhotoScrape_L2_SafeState: {type: Int16}
  PhotoScrape_L2_Retryable: {type: Boolean}

  # ── FeedLift 玻璃上下料伺服 L2 通道 (第5通道; 由 A10_上下料伺服流程 解构) ──
  FeedLift_L2_ActionCode: {type: Int16}
  FeedLift_L2_RequestSeq: {type: Int32}
  FeedLift_L2_Start: {type: Boolean}
  FeedLift_L2_Reset: {type: Boolean}
  FeedLift_L2_State: {type: Int16, comment: "0=IDLE,10=RUNNING,20=DONE,30=REJECTED,40=ERROR,50=INTERRUPTED"}
  FeedLift_L2_ActiveCode: {type: Int16}
  FeedLift_L2_AcceptedSeq: {type: Int32}
  FeedLift_L2_CompletedSeq: {type: Int32}
