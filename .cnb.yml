# CNB：main 被 GitHub Actions 同步过来后，部署到国内机 81.69.12.254
# 密钥在 private 仓 emoera/plc-sim-deploy-env（Web 密钥仓编辑易弄坏私钥换行）
main:
  push:
    - name: deploy-cn
      stages:
        - name: version
          script: |
            set -euo pipefail
            SHORT="$(echo "${CNB_COMMIT:-}" | cut -c1-7)"
            if [ -z "$SHORT" ] || [ "$SHORT" = "" ]; then
              SHORT="$(git rev-parse --short HEAD)"
            fi
            echo "$SHORT $(date -u '+%Y-%m-%d %H:%M UTC')" > PLC-Sim/VERSION
            cat PLC-Sim/VERSION

        - name: rsync-and-restart
          image: tencentcom/rsync
          imports:
            - https://cnb.cool/emoera/plc-sim-deploy-env/-/blob/main/deploy-cn.yml
          settings:
            user: $LOGIN_USER
            key: $PRIVATE_KEY
            hosts:
              - 81.69.12.254
            port: 22
            source: ./PLC-Sim/
            target: /www/wwwroot/PLC-Sim/
            recursive: true
            delete: true
            exclude:
              - .venv/
              - __pycache__/
              - .pytest_cache/
              - .DS_Store
              - "*.pyc"
              - .env
              - data/uploads/
              - extracted/
            # 远程命令保持单行：复杂逻辑在仓库脚本里（随 rsync 一起上去）
            script:
              - bash /www/wwwroot/PLC-Sim/scripts/cnb_post_deploy.sh
