[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilab-opcua-sim"
version = "0.2.6"
description = "CSV-driven OPC UA Server, Web GUI, and PLC handshake simulators"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "opcua==0.98.13",
  "PyYAML>=6.0,<7",
  "fastapi>=0.110,<1",
  "uvicorn>=0.23,<1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
opcua-sim = "opcua_sim.cli:main"

[tool.setuptools]
packages = ["opcua_sim", "opcua_sim.gui", "opcua_sim.ino_mcp"]
package-dir = {opcua_sim = ".", "opcua_sim.gui" = "gui", "opcua_sim.ino_mcp" = "ino_mcp"}
include-package-data = false

[tool.setuptools.package-data]
opcua_sim = [
  "config/*.yaml",
  "data/*.csv",
  "vendor/inoproshop-mcp/*.js",
  "vendor/inoproshop-mcp/*.py",
  "vendor/inoproshop-mcp/*.md",
  ".env.example",
]
"opcua_sim.gui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
